name: R2 weak line cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r2-weak.yml"

concurrency:
  group: r2-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://f2973a9b06bd5d30be681c629f19145e.r2.cloudflarestorage.com
      R2_BUCKET: rekupuri-img-apac
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data.js
            .github/scripts
          sparse-checkout-cone-mode: false
      - name: Process posted coloring pages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q boto3 pillow numpy
          cat > weak_r2.py <<'PY'
          import io, os, re, boto3
          import numpy as np
          from botocore.config import Config
          from botocore.exceptions import ClientError
          from PIL import Image, ImageFilter
          B = os.environ["R2_BUCKET"]
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT"], region_name="auto",
              config=Config(request_checksum_calculation="when_required", response_checksum_validation="when_required"))
          def weak(im, blur=0.5, lo=0.25, hi=0.75, mix=0.75, white=0.94):
              im = im.convert("L")
              if blur: im = im.filter(ImageFilter.GaussianBlur(blur))
              a = np.asarray(im).astype(np.float32) / 255
              t = np.clip((a - lo) / (hi - lo), 0, 1); t = t * t * (3 - 2 * t)
              o = mix * t + (1 - mix) * a
              o = np.where(a >= white, 1.0, o)
              return Image.fromarray(np.clip(o * 255 + 0.5, 0, 255).astype(np.uint8), "L")
          t = open("data.js", encoding="utf-8").read()
          files = []
          for e in re.findall(r"\{([^{}]*)\}", t):
              f = re.search(r'file:\s*"([^"]+)"', e)
              if f and not re.search(r"kind:", e) and f.group(1).startswith("up_"):
                  files.append(f.group(1))
          files = sorted(set(files))
          done = skip = 0; fail = []
          for f in files:
              src, bak = "images/" + f, "images_orig/" + f
              try:
                  try:
                      s3.head_object(Bucket=B, Key=bak); skip += 1; continue
                  except ClientError:
                      pass
                  data = s3.get_object(Bucket=B, Key=src)["Body"].read()
                  s3.put_object(Bucket=B, Key=bak, Body=data, ContentType="image/png")
                  out = weak(Image.open(io.BytesIO(data))).quantize(16, dither=Image.Dither.NONE)
                  b = io.BytesIO(); out.save(b, "PNG", optimize=True, dpi=(300, 300))
                  s3.put_object(Bucket=B, Key=src, Body=b.getvalue(), ContentType="image/png",
                                CacheControl="public, max-age=3600")
                  done += 1
              except Exception as e:
                  fail.append(f"{f}: {e}")
          print(f"::notice::targets {len(files)}, processed {done}, already done {skip}, failed {len(fail)}")
          for x in fail[:10]: print("::warning::" + x[:300])
          PY
          .venv/bin/python weak_r2.py
      - name: Refresh thumbnails
        run: |
          .venv/bin/python .github/scripts/make_thumbs.py
