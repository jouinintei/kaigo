name: R2 fetch samples

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r2-fetch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://f2973a9b06bd5d30be681c629f19145e.r2.cloudflarestorage.com
      R2_BUCKET: rekupuri-img-apac
      FILES: up_1787370474442_13.png up_1788526844867_8.png up_1790912756647_10.png up_1791286476779_30.png up_1791627170104_80.png
    steps:
      - run: |
          mkdir out && cd out
          for f in $FILES; do aws s3 cp "s3://$R2_BUCKET/images/$f" "$f" --endpoint-url "$R2_ENDPOINT" --no-progress; done
          git init -q -b r2-audit
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "R2 samples"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r2-audit
