name: Fetch images for audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://f2973a9b06bd5d30be681c629f19145e.r2.cloudflarestorage.com
      R2_BUCKET: rekupuri-img-apac
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/audit
      - name: Download
        run: |
          mkdir out
          while read f; do
            [ -z "$f" ] && continue
            aws s3 cp "s3://$R2_BUCKET/images/$f" "out/$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors || echo "miss $f"
          done < .github/audit/need.txt
          ls out | wc -l
      - name: Shrink and push to temp branch
        run: |
          python3 -m pip install -q pillow
          mkdir small
          python3 - <<'PY'
          import os
          from PIL import Image
          for f in os.listdir('out'):
              im=Image.open('out/'+f)
              if im.mode in ('RGBA','LA','P'):
                  im=im.convert('RGBA'); bg=Image.new('RGB',im.size,'white'); bg.paste(im,mask=im.split()[3]); im=bg
              else: im=im.convert('RGB')
              im.thumbnail((1400,1400))
              im.save('small/'+f+'.jpg',quality=88)
          PY
          cd small
          git init -q -b audit-tmp
          git config user.name bot; git config user.email bot@example.com
          git add . && git commit -qm imgs
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" audit-tmp
