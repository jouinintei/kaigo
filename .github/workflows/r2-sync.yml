name: R2 image sync

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "data.js"
      - ".github/workflows/r2-sync.yml"
      - ".github/scripts/make_thumbs.py"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: r2-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://f2973a9b06bd5d30be681c629f19145e.r2.cloudflarestorage.com
      R2_BUCKET: rekupuri-images
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            images
            .github/scripts
      - name: Check secrets
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY が未設定です"; exit 1
          fi
      - name: Sync images to R2
        run: |
          set +e
          aws s3 sync images "s3://$R2_BUCKET/images" \
            --endpoint-url "$R2_ENDPOINT" \
            --size-only \
            --cache-control "public, max-age=86400" \
            --no-progress > sync.log 2>&1
          code=$?
          tail -n 5 sync.log
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|denied|fail" sync.log | head -n 3 | tr '\n' ' ' | cut -c1-400)
            echo "::error::exit $code $msg"
            exit $code
          fi
          echo "::notice::uploaded $(grep -c '^upload:' sync.log) files"
      - name: Make thumbnails
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q boto3 pillow > pip.log 2>&1 || { echo "::error::pip $(tail -c 400 pip.log | tr '\n' ' ')"; exit 1; }
          .venv/bin/python .github/scripts/make_thumbs.py 2> err.log || { echo "::error::thumbs $(tail -c 500 err.log | tr '\n' ' ')"; exit 1; }
      - name: Count objects
        run: |
          echo "::notice::local $(ls images | wc -l) / r2 $(aws s3 ls "s3://$R2_BUCKET/images/" --endpoint-url "$R2_ENDPOINT" | wc -l)"
