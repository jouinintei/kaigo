name: R2 export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://f2973a9b06bd5d30be681c629f19145e.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: images
      - name: Download images missing from repo
        run: |
          mkdir -p out
          aws s3 sync "s3://rekupuri-img-apac/images" out --endpoint-url "$R2_ENDPOINT" --no-progress > /dev/null
          cd out && for f in *; do [ -e "../images/$f" ] && rm -f "$f"; done; ls | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: r2-only-images
          path: out
          retention-days: 1
