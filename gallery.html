<script>

  // 脳トレのシリーズ名 = 題名の頭の言葉(最初の空白・カッコの前まで)

  function seriesBase(t) {

  const NEW_DAYS = 14;

    const m = /^up_(\d{13})_/.exec(n.file || "");
    if (m) return Number(m[1]);
    if (n.date) { const t = Date.parse(n.date + "T00:00:00+09:00"); if (!isNaN(t)) return t; }

  const SEEN_KEY = "nurie_seen_v1";
  const SEEN_BASE_KEY = "nurie_seen_base_v1";

  })();
  const seenBase = (function () {
    try {
      let b = Number(localStorage.getItem(SEEN_BASE_KEY));

  function logSave(file, src, ctx) {
    _saveQueue.push([file, src || "unknown", ctx || null]);
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => {
      const q = _saveQueue.splice(0);
      const files = q.map(x => x[0]);
      const srcs = q.map(x => x[1]);
      const ctxs = q.map(x => x[2]);
      let ent = null;
      try {
        if (!sessionStorage.getItem("rk_ent_sent")) {
          ent = JSON.parse(sessionStorage.getItem("rk_ent") || "null");
          if (ent) sessionStorage.setItem("rk_ent_sent", "1");
        }
      } catch (e) {}
      try {
        fetch("api/log-save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ files: files, srcs: srcs, ctxs: ctxs, ent: ent, did: deviceId() }),
          keepalive: true
        }).catch(() => {});
      } catch (e) {}
    }, 2000);
  }
  function pageSrc() {
    return page === "list" ? "list" : page === "fav" ? "fav" : page === "noutore" ? "noutore" : page === "calendar" ? "calendar" : "unknown";
  }
  function filterCtx() {
    const c = {};
    if (selSeason) c.se = selSeason;
    if (selGenre) c.ge = selGenre;
    if (selDiff) c.di = selDiff;
    if (selUsed) c.us = selUsed;
    if (qWord && qWord.trim()) c.q = qWord.trim().slice(0, 30);
    if (seriesView) c.sr = String(seriesView).slice(0, 30);
    return c;
  }
  function mark(file, kind, src, ctx) {
    markSeen(file, true); flushSeen();
    const h = loadHist();
    if (!h[file]) h[file] = {};
    h[file][kind] = today();
    saveJSON(STORE_KEY, h);
    if (kind === "save") logSave(file, src || pageSrc(), ctx || (src ? null : filterCtx()));
  }
  function unmark(file, kind) {
    const h = loadHist();
    if (h[file]) {
      delete h[file][kind];
      if (!h[file].print && !h[file].save) delete h[file];
      saveJSON(STORE_KEY, h);
    }
    render();
  }
  function isUsed(file) { return !!loadHist()[file]; }

  const loadFav = () => loadJSON(FAV_KEY, []);
  function isFav(file) { return loadFav().includes(file); }
  const _favQueue = [];
  let _favTimer = null;
  function logFav(file, on) {
    _favQueue.push([file, on ? 1 : 0, page === "fav" ? "fav" : page]);
    clearTimeout(_favTimer);
    _favTimer = setTimeout(() => {
      const q = _favQueue.splice(0);
      if (!q.length) return;
      fetch("api/log-save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ favs: q, did: deviceId() }),
        keepalive: true
      }).catch(() => {});
    }, 1500);
  }
  // 塗り絵の拡大表示・色見本を開いた回数を記録
  const _openQueue = [];
  let _openTimer = null;
  function logOpen(file, kind) {
    if (!file) return;
    _openQueue.push([file, kind]);
    clearTimeout(_openTimer);
    _openTimer = setTimeout(() => {
      const q = _openQueue.splice(0);
      if (!q.length) return;
      fetch("api/log-save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ opens: q, did: deviceId() }),
        keepalive: true
      }).catch(() => {});
    }, 3000);
  }
  function toggleFav(file) {
    let f = loadFav();
    const on = !f.includes(file);
    if (!on) f = f.filter(x => x !== file);
    else f.push(file);
    saveJSON(FAV_KEY, f);
    logFav(file, on);
    render();
  }

  function buildToolbar() {
    const bar = document.getElementById("toolbar");
    bar.innerHTML = "";
    if (page === "fav") return;
    if (seriesView && (page === "list" || page === "noutore")) {
      const lbl = document.createElement("span");
      lbl.style.fontWeight = "bold";
      lbl.style.fontSize = "18px";
      lbl.style.marginRight = "6px";
      lbl.textContent = "📚 " + seriesView + " シリーズ";
      bar.appendChild(lbl);
      const back = document.createElement("button");
      back.className = "reset-btn";
      back.textContent = "← 一覧にもどる";
      back.onclick = () => {
        if (navDepth > 0) { history.back(); }
        else { seriesView = null; curPage = 1; render(); syncState(); }
      };
      bar.appendChild(back);
      return;
    }
    if (page === "calendar") {
      if (calMonth) {
        const backM = document.createElement("button");
        backM.className = "cal-btn";
        backM.textContent = "← 月の一覧にもどる";
        backM.onclick = () => {
          if (navDepth > 0 && history.state && history.state.calMonth) { history.back(); }
          else { calMonth = null; render(); syncState(); }
        };
        bar.appendChild(backM);
      }
      return;
    }
    const sub = kindSubset();
    const seasons = seasonOrder.filter(s => sub.some(n => n.season === s));
    const GENRE_ORDER = ["花", "動物", "食べ物", "行事", "風景", "風物詩", "その他"];
    const genresOf = (season) => {
      const g = [];
      sub.forEach(n => {
        if (!n.genre) return;
        if (season && n.season !== season) return;
        if (!g.includes(n.genre)) g.push(n.genre);
      });
      g.sort((a, b) => {
        const ia = GENRE_ORDER.indexOf(a), ib = GENRE_ORDER.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      return g;
    };
    const genres = genresOf(selSeason);

    const addSelect = (labelText, options, current, onChange) => {
      const wrap = document.createElement("div");
      wrap.className = "filter";
      const label = document.createElement("label");
      label.textContent = labelText;
      const sel = document.createElement("select");
      ["すべて"].concat(options).forEach(o => {
        const op = document.createElement("option");
        op.value = o;
        op.textContent = o;
        sel.appendChild(op);
      });
      sel.value = current || "すべて";
      sel.classList.toggle("picked", !!current);
      sel.onchange = () => { curPage = 1; seriesView = null; onChange(sel.value === "すべて" ? null : sel.value); syncState(); };
      wrap.appendChild(label);
      wrap.appendChild(sel);
      bar.appendChild(wrap);
    };

    const genreOnly = (page === "noutore");
    if (genreOnly) {
      selSeason = selDiff = selUsed = null;
      if (genres.length) {
        addSelect("ジャンル:", genres, selGenre, v => { selGenre = v; render(); });
      }
    } else {
      addSelect("季節:", seasons, selSeason, v => {
        selSeason = v;
        if (selGenre && !genresOf(v).includes(selGenre)) selGenre = null;
        render();
      });
      if (genres.length) {
        addSelect("ジャンル:", genres, selGenre, v => { selGenre = v; render(); });
      }
      addSelect("難しさ:", diffs, selDiff, v => { selDiff = v; render(); });
    }

    if (selSeason || selGenre || selDiff || selUsed) {
      const r = document.createElement("button");
      r.className = "reset-btn";
      r.textContent = "✕ 絞り込みを解除";
      r.onclick = () => { selSeason = selGenre = selDiff = selUsed = null; seriesView = null; curPage = 1; render(); syncState(); };
      bar.appendChild(r);
    }
  }

  // ---- キーワード検索 ----
  // ひらがな・カタカナ・大文字小文字・長音の違いを吸収してから比べます
  function normQ(s) {
    return String(s || "")
      .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .toLowerCase()
      .replace(/[ー－―‐\-・･'"”’　\s]/g, "");
  }
  // よく使う漢字の読み。ひらがなで打っても漢字の作品が見つかるようにします
  const YOMI = {
    "猫":"ねこ","犬":"いぬ","兎":"うさぎ","鼠":"ねずみ","熊":"くま","狼":"おおかみ",
    "馬":"うま","羊":"ひつじ","鳥":"とり","魚":"さかな","鯉":"こい","金魚":"きんぎょ",
    "鶴":"つる","亀":"かめ","蝶":"ちょう","蛍":"ほたる","虫":"むし","猿":"さる","鹿":"しか",
    "花":"はな","桜":"さくら","梅":"うめ","菊":"きく","菜":"な","葉":"は","木":"き","森":"もり",
    "海":"うみ","山":"やま","川":"かわ","空":"そら","雪":"ゆき","雨":"あめ","月":"つき","星":"ほし",
    "春":"はる","夏":"なつ","秋":"あき","冬":"ふゆ","正月":"しょうがつ","節分":"せつぶん",
    "餅":"もち","柿":"かき","栗":"くり","芋":"いも","米":"こめ","茶":"ちゃ","酒":"さけ",
    "傘":"かさ","舟":"ふね","船":"ふね","駅":"えき","家":"いえ","庭":"にわ","窓":"まど",
    "着物":"きもの","盆栽":"ぼんさい","茶道":"さどう","歌舞伎":"かぶき","漬物":"つけもの",
    "誕生日":"たんじょうび","喫茶店":"きっさてん","干し柿":"ほしがき","漢字":"かんじ",
    "計算":"けいさん","言葉":"ことば","動物":"どうぶつ","風景":"ふうけい","食":"たべもの",
    "行事":"ぎょうじ","初級":"やさしい","上級":"むずかしい",
    "焼":"やき","煮":"に","揚":"あげ","汁":"しる","鍋":"なべ","湯":"ゆ","豆":"まめ",
    "卵":"たまご","団子":"だんご","寿司":"すし","弁当":"べんとう","饅":"まん","菓子":"かし",
    "野菜":"やさい","果物":"くだもの","果":"くだもの","味":"あじ","料理":"りょうり",
    "祭":"まつり","花火":"はなび","風鈴":"ふうりん","団扇":"うちわ","扇":"おうぎ",
    "縁側":"えんがわ","囲炉裏":"いろり","障子":"しょうじ","神社":"じんじゃ","寺":"てら",
    "城":"しろ","橋":"はし","道":"みち","畑":"はたけ","田":"た","稲":"いね","麦":"むぎ",
    "温泉":"おんせん","風呂":"ふろ","電車":"でんしゃ","汽車":"きしゃ","自転車":"じてんしゃ",
    "帽子":"ぼうし","眼鏡":"めがね","時計":"とけい","電話":"でんわ","手紙":"てがみ",
    "子供":"こども","女":"おんな","男":"おとこ","老":"ろう","朝":"あさ","昼":"ひる","夜":"よる",
    "紅葉":"もみじ","落葉":"おちば","若葉":"わかば","竹":"たけ","松":"まつ","柳":"やなぎ",
    "実":"み","種":"たね","苗":"なえ","池":"いけ","滝":"たき","岩":"いわ","砂":"すな",
    "雲":"くも","風":"かぜ","虹":"にじ","氷":"こおり","炭":"すみ","火":"ひ","水":"みず"
  };
  let YOMI_KEYS = Object.keys(YOMI).sort((a, b) => b.length - a.length);
  let AUTO_T = {};
  fetch("https://img.rekupuri.com/search/yomi.json", { mode: "cors" })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j) return;
      AUTO_T = j.t || {};
      Object.keys(j.w || {}).forEach(k => { if (!(k in YOMI)) YOMI[k] = j.w[k]; });
      YOMI_KEYS = Object.keys(YOMI).sort((a, b) => b.length - a.length);
      if (qWord) render();
    })
    .catch(() => {});
  function withYomi(t) {
    let add = "";
    YOMI_KEYS.forEach(k => { if (t.indexOf(k) >= 0) add += YOMI[k]; });
    return t + add;
  }
  function toKana(t) {
    let s = String(t);
    YOMI_KEYS.forEach(k => { s = s.split(k).join(YOMI[k]); });
    return s;
  }
  function matchQ(n) {
    if (!qWord) return true;
    const base = [n.title, n.genre, n.season, n.diff, kindOf(n)].join(" ");
    // 漢字のまま・ぜんぶ読み仮名にしたもの、両方を用意して照合します
    const hay = normQ(base) + "|" + normQ(toKana(base)) + "|" + normQ(withYomi(base)) + "|" + normQ(AUTO_T[n.file] || "");
    const words = qWord.trim().split(/[\s,、]+/).filter(Boolean);
    if (!words.length) return true;
    return words.every(w => hay.indexOf(normQ(w)) >= 0 || hay.indexOf(normQ(toKana(w))) >= 0);
  }

  function currentShown() {
    if (page === "fav") {
      const f = loadFav();
      return list.filter(n => f.includes(n.file)).filter(matchQ);
    }
    if (page === "calendar") {
      if (!calMonth) return [];
      return kindSubset().filter(n => calKey(n) === calMonth)
        .slice().sort((a, b) => String(a.title).localeCompare(String(b.title), "ja"));
    }
    return kindSubset().filter(matchQ).filter(n =>
      (!selSeason || n.season === selSeason) &&
      (!selGenre || n.genre === selGenre) &&
      (!selDiff || n.diff === selDiff) &&
      (!selUsed ||
       (selUsed === "使用済み" && isUsed(n.file)) ||
       (selUsed === "未使用" && !isUsed(n.file))));
  }

  const VOTE_KEY = "rekupuri_vote_v1";
  function render() {
    const nFav = loadFav().length;
    document.getElementById("tabNoutore").classList.toggle("active", page === "noutore");
    document.getElementById("tabList").classList.toggle("active", page === "list");
    document.getElementById("tabCal").classList.toggle("active", page === "calendar");
    const tf = document.getElementById("tabFav");
    tf.classList.toggle("active", page === "fav");
    tf.textContent = "★ お気に入り" + (nFav ? " (" + nFav + ")" : "");

    const PAGE_INTRO = {
      noutore: "難読漢字、計算問題、ことわざ、言葉探しなど、高齢者向けの脳トレプリントを無料で配布しています。すべて答え付きです。",
      calendar: "cal"
    };
    const intro = document.getElementById("pageIntro");
    const introTxt = (!seriesView && !qWord && PAGE_INTRO[page]) || "";
    intro.classList.toggle("cal-guide", introTxt === "cal");
    if (introTxt === "cal") {
      intro.innerHTML =
        '<div class="cg-block"><div class="cg-title">カレンダーは2種類あります</div>' +
        '<ul><li><b>絵柄つき</b> … そのまま印刷して使えます</li>' +
        '<li><b>貼り付け用</b> … 上半分が空白です。塗り終えた塗り絵や、ちぎり絵・貼り絵・写真などを貼って仕上げます</li></ul></div>' +
        '<div class="cg-block"><div class="cg-title">貼り付け用に塗り絵を貼るときは</div>' +
        '<ul><li>空白の大きさは <b>横 約21cm × 縦 約14.5cm</b>(ほぼA5の横向き)</li>' +
        '<li>横向きの塗り絵 → <b>「A5」または「71%」</b>に縮小して印刷<br><small>はみ出した端は少し切ってください</small></li>' +
        '<li>縦向きの塗り絵 → <b>「50%」</b>に縮小して印刷<br><small>はがきくらいの大きさになります</small></li>' +
        '<li>のりは<b>スティックのりか両面テープ</b>がおすすめ<br><small>紙が波打ちにくくなります</small></li></ul></div>';
    } else {
      intro.textContent = introTxt;
    }
    intro.style.display = introTxt ? "" : "none";
    const wa = document.getElementById("weekAdded");
    if (!wa.dataset.built) {
      wa.dataset.built = "1";
      const jst = new Date(Date.now() + 9 * 3600e3);
      const dow = (jst.getUTCDay() + 6) % 7;
      const weekStart = Date.UTC(jst.getUTCFullYear(), jst.getUTCMonth(), jst.getUTCDate() - dow) - 9 * 3600e3;
      const wc = {};
      let total = 0;
      list.forEach(n => {
        const m = /^up_(\d{13})_/.exec(n.file || "");
        if (!m || Number(m[1]) < weekStart) return;
        const k = kindOf(n) === "塗り絵" ? (n.season || "通年") : kindOf(n);
        wc[k] = (wc[k] || 0) + 1;
        total++;
      });
      if (total > 0) {
        const order = ["春", "夏", "秋", "冬", "通年", "脳トレ", "カレンダー"];
        const chips = order.filter(k => wc[k]).map(k =>
          '<span class="wa-chip c-' + k + '">' + k + ' <span>' + wc[k] + '</span>枚</span>').join("");
        wa.innerHTML = '<div class="wa-head">🆕 今週は<b>' + total + '</b>枚追加しました</div>' +
          '<div class="wa-chips">' + chips + '</div>';
        wa.dataset.has = "1";
      }
    }
    wa.style.display = (wa.dataset.has && page === "list" && !seriesView && !qWord && curPage === 1) ? "" : "none";
    const rankBox = document.getElementById("rankBox");
    rankBox.style.display = (page === "list" && !seriesView && !qWord && curPage === 1 && rankBox.dataset.ready) ? "" : "none";
    const monthBox = document.getElementById("monthBox");
    monthBox.style.display = (page === "list" && !seriesView && !qWord && curPage === 1 && monthBox.dataset.ready) ? "" : "none";
    rankBox.querySelectorAll(".rfav").forEach(b => {
      const on = isFav(b.dataset.file);
      b.classList.toggle("on", on);
      b.textContent = on ? "★" : "☆";
    });

    // 検索欄 (カレンダーの月一覧では出さない)
    const sBar = document.getElementById("searchBar");
    const qEl = document.getElementById("q");
    sBar.style.display = (page === "calendar") ? "none" : "flex";
    if (qEl.value !== qWord) qEl.value = qWord;
    qEl.classList.toggle("on", !!qWord);
    document.getElementById("qClear").classList.toggle("show", !!qWord);

    buildToolbar();

    const hist = loadHist();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    if (page === "calendar" && !calMonth) {
      const months = [];
      kindSubset().forEach(n => {
        const k = calKey(n);
        let m = months.find(x => x.key === k);
        if (!m) { m = { key: k, year: n.year || 0, month: n.month || 0, count: 0, label: calLabel(n) }; months.push(m); }
        m.count++;
      });
      months.sort((a, b) => (b.year - a.year) || (b.month - a.month));
      document.getElementById("count").textContent = "";
      renderPager(1);
      const empty = document.getElementById("empty");
      empty.style.display = months.length ? "none" : "block";
      empty.textContent = "カレンダーはまだありません";
      document.getElementById("bulkBar").classList.remove("show");
      months.forEach(m => {
        const b = document.createElement("button");
        b.className = "month-btn";
        b.innerHTML = "📅 " + m.label + '<span class="mcount">' + m.count + " 枚</span>";
        b.onclick = () => { calMonth = m.key; curPage = 1; pushNav(); render(); };
        grid.appendChild(b);
      });
      return;
    }

    let all = currentShown();

    const seriesCounts = {};
    const seriesNew = {};
    let seriesGrouped = false;
    // シリーズにまとめるのは脳トレだけ (塗り絵はすべて単独で表示)
    // キーワード検索中は、探しているものが埋もれないよう1枚ずつ出します
    const useSeries = !qWord && (page === "noutore");
    if (useSeries) {
      if (seriesView) {
        all = all.filter(n => seriesBase(n.title) === seriesView)
                 .slice().sort((a, b) =>
                   (list.indexOf(a) - list.indexOf(b)));
      } else {
        seriesGrouped = true;
        const groups = new Map();
        all.forEach(n => {
          const b = seriesBase(n.title);
          if (!groups.has(b)) groups.set(b, []);
          groups.get(b).push(n);
        });
        all = [];
        groups.forEach((arr, b) => {
          seriesCounts[b] = arr.length;
          seriesNew[b] = arr.some(isNewItem);
          arr.sort((a, c) => list.indexOf(a) - list.indexOf(c));
          all.push(arr[0]);
        });
      }
    }

    const totalPages = Math.max(1, Math.ceil(all.length / PER_PAGE));
    if (curPage > totalPages) curPage = totalPages;
    if (curPage < 1) curPage = 1;
    const shown = all.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);

    document.getElementById("count").textContent =
      all.length
        ? (qWord ? "「" + qWord.trim() + "」の検索結果 " : "") + all.length + " 枚あります" +
          (totalPages > 1 ? "(" + curPage + " / " + totalPages + " ページ)" : "")
        : "";
    renderPager(totalPages);
    const empty = document.getElementById("empty");
    empty.style.display = all.length ? "none" : "block";
    empty.textContent = qWord
      ? "「" + qWord.trim() + "」に当てはまる作品は見つかりませんでした"
      : page === "fav"
      ? "お気に入りはまだありません(カード右上の ☆ を押すと登録できます)"
      : (page === "noutore"
        ? "この条件の脳トレはまだありません"
        : (page === "calendar"
          ? "カレンダーはまだありません"
          : "この条件の塗り絵はまだありません"));

    document.getElementById("bulkBar").classList.toggle("show", page === "fav" && all.length > 0);

    shown.forEach(n => {
      const sBase = seriesBase(n.title);
      const sCount = seriesGrouped ? (seriesCounts[sBase] || 1) : 1;
      if (sCount > 1) {
        const card = document.createElement("div");
        card.className = "card";
        const openSeries = () => {
          seriesView = sBase;
          curPage = 1;
          pushNav();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const img = document.createElement("img");
        img.src = thumbPath(n, n.file);
        img.alt = sBase;
        img.onerror = () => {
          if (!img.dataset.retry) {
            // 古いキャッシュが残っている場合に備えて、キャッシュを無視して1回だけ読み直す
            img.dataset.retry = "1";
            img.src = imgPath(n, n.file) + (n.v ? "&" : "?") + "r=" + Date.now();
            return;
          }
          thumb.innerHTML = '<div class="noimg">画像が見つかりません<br>(' + n.file + ')</div>';
        };
        img.onclick = openSeries;
        thumb.appendChild(img);
        const meta = document.createElement("div");
        meta.className = "meta";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = sBase;
        const tags = document.createElement("div");

    const addGap = () => {
      const s = document.createElement("span");
      s.className = "gap";
      s.textContent = "…";
      pager.appendChild(s);
    };
    if (totalPages <= 10) {
      for (let n = 1; n <= totalPages; n++) addNum(n);
    } else {
      const span = 7;
      let start = Math.max(2, curPage - 3);
      let end = Math.min(totalPages - 1, start + span - 1);
      start = Math.max(2, end - span + 1);
      addNum(1);
      if (start > 2) addGap();
      for (let n = start; n <= end; n++) addNum(n);
      if (end < totalPages - 1) addGap();
      addNum(totalPages);
    }
    const next = document.createElement("button");
    next.textContent = "次へ →";
    next.disabled = curPage === totalPages;
    next.onclick = () => go(curPage + 1);
    pager.appendChild(next);

  const relGrams = new Map();
  function gramsOf(n) {
    if (relGrams.has(n.file)) return relGrams.get(n.file);
    const t = normQ(String(n.title || "").replace(/その\d+|\d+/g, ""));
    const g = new Set();
    for (let i = 0; i < t.length - 1; i++) {
      const b = t.slice(i, i + 2);
      if (/[のとや]/.test(b)) continue;
      g.add(b);
    }
    if (t.length === 1) g.add(t);
    relGrams.set(n.file, g);
    return g;
  }
  function relatedOf(n, max) {
    const mine = gramsOf(n);
    const scored = [];
    list.forEach(m => {
      if (m.file === n.file || kindOf(m) !== "塗り絵") return;
      let sc = 0;
      if (n.genre && m.genre === n.genre) sc += 3;
      if (m.season === n.season) sc += 2;
      else if (m.season === "通年" || n.season === "通年") sc += 0.5;
      const g = gramsOf(m);
      for (const b of mine) { if (g.has(b)) { sc += 2; break; } }
      if (n.diff && m.diff === n.diff) sc += 1;
      if (sc >= 3) scored.push({ m: m, sc: sc + Math.random() * 0.9 });
    });
    scored.sort((a, b) => b.sc - a.sc);
    const DORD = { "初級": 1, "中級": 2, "上級": 3 };
    const norm = s => String(s || "").replace(/[\s　]/g, "");
    const nt = norm(n.title);
    const others = list.filter(m => m.file !== n.file && kindOf(m) === "塗り絵");
    const same = others.filter(m => norm(m.title) === nt)
      .sort((a, b) => (DORD[a.diff] || 9) - (DORD[b.diff] || 9));
    const near = nt.length >= 2 ? others.filter(m => {
      const mt = norm(m.title);
      return mt !== nt && mt.length >= 2 && (mt.indexOf(nt) >= 0 || nt.indexOf(mt) >= 0);
    }).sort((a, b) => (DORD[a.diff] || 9) - (DORD[b.diff] || 9)) : [];
    const out = [];
    const used = new Set([n.file]);
    same.concat(near).forEach(m => { if (!used.has(m.file)) { used.add(m.file); out.push(m); } });
    const seen = new Set(out.map(m => m.title).concat([n.title]));
    scored.forEach(x => {
      if (used.has(x.m.file) || seen.has(x.m.title)) return;
      seen.add(x.m.title); used.add(x.m.file); out.push(x.m);
    });
    return out.slice(0, max);
  }

  function idbOpen(name) {
    return new Promise((res, rej) => {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(dbName, k) {
    const db = await idbOpen(dbName);
    return new Promise((res, rej) => {
      const rq = db.transaction("kv").objectStore("kv").get(k);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  async function idbSet(dbName, k, v) {
    const db = await idbOpen(dbName);
    return new Promise((res, rej) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function ensurePerm(handle, mode) {
    try {
      if ((await handle.queryPermission({ mode: mode })) === "granted") return true;
      return (await handle.requestPermission({ mode: mode })) === "granted";
    } catch (e) { return false; }
  }

  // 色見本を保存するときだけ、右下に rekupuri.com を入れる
  async function stampSample(blob) {
    try {
      const bmp = await createImageBitmap(blob);
      const w = bmp.width, h = bmp.height;
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(bmp, 0, 0);
      const text = "rekupuri.com";
      const fs = Math.round(Math.min(w, h) * 0.0245);
      ctx.font = "bold " + fs + "px Arial, Helvetica, sans-serif";
      const tw = ctx.measureText(text).width;
      const right = w - Math.min(w, h) * 0.043, base = h - Math.min(w, h) * 0.022, pad = fs * 0.35;
      ctx.fillStyle = "rgba(255,255,255,.88)";
      ctx.fillRect(right - tw - pad, base - fs * 0.95, tw + pad * 2, fs * 1.25);
      ctx.fillStyle = "#666";
      ctx.textAlign = "right";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(text, right, base);
      return await new Promise(res => cv.toBlob(b => res(b || blob), "image/jpeg", 0.92));
    } catch (e) { return blob; }
  }

    if (!r || !r.ok) r = await fetch("images/" + file);

  // ZIPを作る部品 (外部の部品を使わないので、どの環境でも動きます)
  function crc32(buf) {
    let table = crc32.t;
    if (!table) {
      table = crc32.t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        table[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0, cdSize = 0;
    const d = new Date();
    const t = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
    const dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    files.forEach(f => {
      const nb = enc.encode(f.name);
      const crc = crc32(f.data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, t, true); lh.setUint16(12, dt, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, f.data.length, true); lh.setUint32(22, f.data.length, true);
      lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nb, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, t, true); ch.setUint16(14, dt, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, f.data.length, true); ch.setUint32(24, f.data.length, true);
      ch.setUint16(28, nb.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nb);
      cdSize += 46 + nb.length;
      offset += 30 + nb.length + f.data.length;
    });
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
    eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
    eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true); eo.setUint16(20, 0, true);
    return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), { type: "application/zip" });
  }

  // まとめて保存 その2: 1つのZIPにまとめて保存 (どのパソコン・ブラウザでも動きます)
  async function bulkZipSave(shown) {
    showToast("画像をまとめています。しばらくお待ちください…");
    const files = [];
    const used = {};
    const uniq = (name) => {
      if (!used[name]) { used[name] = 1; return name; }
      const i = name.lastIndexOf(".");
      const stem = i >= 0 ? name.slice(0, i) : name;
      const ext = i >= 0 ? name.slice(i) : "";
      return stem + "(" + (++used[name]) + ")" + ext;
    };
    const add = async (file, name) => {
      const b = await fetchImageBlob(file);
      files.push({ name: FOLDER_NAME + "/" + uniq(name), data: new Uint8Array(await b.arrayBuffer()) });
    };
    let ok = 0;
    for (const n of shown) {
      try {
        await add(n.file, dlName(n));
        if (n.answer) await add(n.answer, dlNameAns(n));
        mark(n.file, "save", "bulk");
        ok++;
        if (shown.length > 5) {
          showToast("画像をまとめています… " + ok + " / " + shown.length + " 枚");
        }
      } catch (e) {}
    }
    if (!ok) {
      showToast("保存できませんでした。通信の状態を確かめて、もう一度お試しください");
      return;
    }
    const blob = makeZip(files);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    // ファイル名は半角にしておく (日本語名を落としてしまうブラウザがあるため)
    a.download = "kaigo-no-rekupuri.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    render();

  }

        fav.textContent = isFav(n.file) ? "★" : "☆";
        fav.title = "お気に入りに登録/解除";
        fav.onclick = (e) => { e.stopPropagation(); toggleFav(n.file); };
        const img = document.createElement("img");
        img.src = thumbPath(n, n.file);
        img.alt = n.title;
        img.loading = "lazy";
        const no = document.createElement("span");
        no.className = "no " + cls[i];
        no.textContent = i + 1;
        const t = document.createElement("div");
        t.className = "ttl";
        t.textContent = n.title;
        const s = document.createElement("div");
        s.className = "sub";
        s.textContent = [n.season, n.genre, n.diff].filter(Boolean).join("・");
        b.append(no, fav, img, t, s);
        b.onclick = () => { openLightbox(n, "rank"); pushNav(); };
        box.appendChild(b);
      });
      document.getElementById("rankBox").dataset.ready = "1";
      if (page === "list") render();
    })
    .catch(() => {});
  const qp = new URLSearchParams(location.search).get("page");
  if (qp === "noutore" || qp === "calendar" || qp === "fav") page = qp;
  const qs0 = new URLSearchParams(location.search);
  if (qs0.get("season")) selSeason = qs0.get("season");
  if (qs0.get("genre")) selGenre = qs0.get("genre");
  const basePage = page;
  window.addEventListener("popstate", e => {
    const st = e.state || { page: basePage, d: 0 };
    navDepth = st.d || 0;
    applyState(st);
  });
  const hs0 = history.state;
  if (hs0 && hs0.page) {
    // 再読み込みや「TOPから戻ってきた」ときは、前回見ていた画面を復元する
    navDepth = hs0.d || 0;
    applyState(hs0);
  } else {
    try { history.replaceState(currentStateObj(), ""); } catch (e) {}
    render();
  }
})();
</script>
