<script>
(function () {
  const MEMBER_TAB = true;
  function dedupe(arr) {
    const seen = new Set();
    return arr.filter(n => {
      if (!n || !n.file || seen.has(n.file)) return false;
      seen.add(n.file);
      return true;
    });
  }
  let list = dedupe((window.NURIE_LIST || []).slice().reverse());
  let page = "list";
  let selSeason = null;
  let selGenre = null;
  let selDiff = null;
  let selUsed = null;
  let seriesView = null;
  let qWord = "";

  const MEMBER_KEY = "nurie_member_v1";
  function isMemberUnlocked() {
    try { return localStorage.getItem(MEMBER_KEY) === "yes"; } catch (e) { return false; }
  }
  function clearMemberUnlock() {
    try { localStorage.removeItem(MEMBER_KEY); } catch (e) {}
  }
  async function unlockMember() {
    const pw = window.prompt("会員パスワードを入力してください");
    if (pw === null) return false;
    try {
      const r = await fetch("api/member-login?pw=" + encodeURIComponent(pw.trim()));
      if (r.ok) {
        try { localStorage.setItem(MEMBER_KEY, "yes"); } catch (e) {}
        return true;
      }
      if (r.status === 401) alert("パスワードが違います");
      else alert("会員機能の準備がまだのようです(設定を確認してください)");
    } catch (e) {
      alert("通信できませんでした。電波の良いところでもう一度お試しください");
    }
    return false;
  }
  function imgPath(n, file) {
    return (n && n.member ? "member-img/" : "images/") + file;
  }

  let memberLoaded = false;
  async function loadMemberList() {
    try {
      const r = await fetch("api/member-list");
      if (r.status === 403) return "auth";
      if (!r.ok) return "err";
      const txt = await r.text();
      let entries = [];
      try {
        entries = new Function('"use strict"; return [' + txt + ']')() || [];
      } catch (e) { return "err"; }
      entries = entries.filter(Boolean).map(e => Object.assign({}, e, { member: true })).reverse();
      list = dedupe(entries.concat(list.filter(n => !n.member)));
      memberLoaded = true;
      return "ok";
    } catch (e) { return "err"; }
  }

  // 脳トレのシリーズ名 = 題名の頭の言葉(最初の空白・カッコの前まで)
  // 例: 「虫食い算 その3」「難読漢字(魚へん)」「ことばさがし くだもの」
  //   → 「虫食い算」「難読漢字」「ことばさがし」
  function seriesBase(t) {
    const s = String(t).replace(/\s*その\d+(\s*[((][^))]*[))])?$/, "");
    const m = s.match(/^[^\s　((]+/);
    return m ? m[0] : s;
  }
  function seriesNum(t) {
    const m = String(t).match(/その(\d+)(?:\s*[((][^))]*[))])?$/);
    return m ? parseInt(m[1], 10) : 1;
  }
  let curPage = 1;
  const PER_PAGE = 9;
  let calMonth = null;

  function calKey(n) { return (n.year || 0) + "-" + (n.month || 0); }
  function calLabel(n) { return (n.year ? n.year + "年" : "") + (n.month ? n.month + "月" : "その他"); }

  const seasonOrder = ["春", "夏", "秋", "冬", "通年"];
  const diffs = ["初級", "中級", "上級"];
  const useds = ["未使用", "使用済み"];

  function kindOf(n) {
    if (n.kind === "脳トレ") return "脳トレ";
    if (n.kind === "カレンダー") return "カレンダー";
    return "塗り絵";
  }
  function pageKind() {
    if (page === "noutore") return "脳トレ";
    if (page === "calendar") return "カレンダー";
    return "塗り絵";
  }
  let memberKind = "塗り絵";
  function kindSubset() {
    if (page === "member") {
      return list.filter(n => n.member && kindOf(n) === memberKind);
    }
    return list.filter(n => kindOf(n) === pageKind());
  }

  const STORE_KEY = "nurie_history_v1";
  const FAV_KEY = "nurie_fav_v1";
  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function saveJSON(key, v) {
    try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
  }

  const loadHist = () => loadJSON(STORE_KEY, {});
  function today() {
    const d = new Date();
    return (d.getMonth() + 1) + "/" + d.getDate();
  }
  function mark(file, kind) {
    const h = loadHist();
    if (!h[file]) h[file] = {};
    h[file][kind] = today();
    saveJSON(STORE_KEY, h);
  }
  function unmark(file, kind) {
    const h = loadHist();
    if (h[file]) {
      delete h[file][kind];
      if (!h[file].print && !h[file].save) delete h[file];
      saveJSON(STORE_KEY, h);
    }
    render();
  }
  function isUsed(file) { return !!loadHist()[file]; }

  const loadFav = () => loadJSON(FAV_KEY, []);
  function isFav(file) { return loadFav().includes(file); }
  function toggleFav(file) {
    let f = loadFav();
    if (f.includes(file)) f = f.filter(x => x !== file);
    else f.push(file);
    saveJSON(FAV_KEY, f);
    render();
  }

  function buildToolbar() {
    const bar = document.getElementById("toolbar");
    bar.innerHTML = "";
    if (page === "fav") return;
    if (page === "member") {
      const lbl = document.createElement("span");
      lbl.style.fontWeight = "bold";
      lbl.style.fontSize = "18px";
      lbl.textContent = "🔒 会員専用";
      bar.appendChild(lbl);
      const kindsAvail = ["塗り絵", "脳トレ", "カレンダー"].filter(k =>
        list.some(n => n.member && kindOf(n) === k));
      if (kindsAvail.length && !kindsAvail.includes(memberKind)) memberKind = kindsAvail[0];
      if (kindsAvail.length > 1) {
        kindsAvail.forEach(k => {
          const b = document.createElement("button");
          b.className = "cal-btn";
          b.textContent = k;
          if (k === memberKind) {
            b.style.background = "#e8630a";
            b.style.color = "#fff";
          }
          b.onclick = () => {
            memberKind = k;
            selSeason = selGenre = selDiff = selUsed = null;
            seriesView = null;
            curPage = 1;
            render();
            syncState();
          };
          bar.appendChild(b);
        });
      }
    }
    if (seriesView && (page === "list" || page === "noutore" || page === "member")) {
      const lbl = document.createElement("span");
      lbl.style.fontWeight = "bold";
      lbl.style.fontSize = "18px";
      lbl.style.marginRight = "6px";
      lbl.textContent = "📚 " + seriesView + " シリーズ";
      bar.appendChild(lbl);
      const back = document.createElement("button");
      back.className = "reset-btn";
      back.textContent = "← 一覧にもどる";
      back.onclick = () => {
        if (navDepth > 0) { history.back(); }
        else { seriesView = null; curPage = 1; render(); syncState(); }
      };
      bar.appendChild(back);
      return;
    }
    if (page === "calendar") {
      if (calMonth) {
        const backM = document.createElement("button");
        backM.className = "cal-btn";
        backM.textContent = "← 月の一覧にもどる";
        backM.onclick = () => {
          if (navDepth > 0 && history.state && history.state.calMonth) { history.back(); }
          else { calMonth = null; render(); syncState(); }
        };
        bar.appendChild(backM);
      }
      const back = document.createElement("button");
      back.className = "reset-btn";
      back.textContent = "← 塗り絵にもどる";
      back.onclick = () => switchPage("list");
      bar.appendChild(back);
      return;
    }
    const sub = kindSubset();
    const seasons = seasonOrder.filter(s => sub.some(n => n.season === s));
    const GENRE_ORDER = ["花", "動物", "食べ物", "行事", "風景", "風物詩", "その他"];
    const genresOf = (season) => {
      const g = [];
      sub.forEach(n => {
        if (!n.genre) return;
        if (season && n.season !== season) return;
        if (!g.includes(n.genre)) g.push(n.genre);
      });
      g.sort((a, b) => {
        const ia = GENRE_ORDER.indexOf(a), ib = GENRE_ORDER.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      return g;
    };
    const genres = genresOf(selSeason);

    const addSelect = (labelText, options, current, onChange) => {
      const wrap = document.createElement("div");
      wrap.className = "filter";
      const label = document.createElement("label");
      label.textContent = labelText;
      const sel = document.createElement("select");
      ["すべて"].concat(options).forEach(o => {
        const op = document.createElement("option");
        op.value = o;
        op.textContent = o;
        sel.appendChild(op);
      });
      sel.value = current || "すべて";
      sel.classList.toggle("picked", !!current);
      sel.onchange = () => { curPage = 1; seriesView = null; onChange(sel.value === "すべて" ? null : sel.value); syncState(); };
      wrap.appendChild(label);
      wrap.appendChild(sel);
      bar.appendChild(wrap);
    };

    const genreOnly = (page === "noutore") ||
      (page === "member" && memberKind !== "塗り絵");
    if (genreOnly) {
      selSeason = selDiff = selUsed = null;
      if (genres.length) {
        addSelect("ジャンル:", genres, selGenre, v => { selGenre = v; render(); });
      }
    } else {
      addSelect("季節:", seasons, selSeason, v => {
        selSeason = v;
        if (selGenre && !genresOf(v).includes(selGenre)) selGenre = null;
        render();
      });
      if (genres.length) {
        addSelect("ジャンル:", genres, selGenre, v => { selGenre = v; render(); });
      }
      addSelect("難しさ:", diffs, selDiff, v => { selDiff = v; render(); });
      addSelect("使用状況:", useds, selUsed, v => { selUsed = v; render(); });
    }

    if (selSeason || selGenre || selDiff || selUsed) {
      const r = document.createElement("button");
      r.className = "reset-btn";
      r.textContent = "✕ 絞り込みを解除";
      r.onclick = () => { selSeason = selGenre = selDiff = selUsed = null; seriesView = null; curPage = 1; render(); syncState(); };
      bar.appendChild(r);
    }
    if (page === "list" && list.some(n => kindOf(n) === "カレンダー")) {
      const c = document.createElement("button");
      c.className = "cal-btn";
      c.textContent = "📅 カレンダーはこちら";
      c.onclick = () => switchPage("calendar");
      bar.appendChild(c);
    }
  }

  // ---- キーワード検索 ----
  // ひらがな・カタカナ・大文字小文字・長音の違いを吸収してから比べます
  function normQ(s) {
    return String(s || "")
      .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .toLowerCase()
      .replace(/[ー－―‐\-・･'"”’　\s]/g, "");
  }
  // よく使う漢字の読み。ひらがなで打っても漢字の作品が見つかるようにします
  const YOMI = {
    "猫":"ねこ","犬":"いぬ","兎":"うさぎ","鼠":"ねずみ","熊":"くま","狼":"おおかみ",
    "馬":"うま","羊":"ひつじ","鳥":"とり","魚":"さかな","鯉":"こい","金魚":"きんぎょ",
    "鶴":"つる","亀":"かめ","蝶":"ちょう","蛍":"ほたる","虫":"むし","猿":"さる","鹿":"しか",
    "花":"はな","桜":"さくら","梅":"うめ","菊":"きく","菜":"な","葉":"は","木":"き","森":"もり",
    "海":"うみ","山":"やま","川":"かわ","空":"そら","雪":"ゆき","雨":"あめ","月":"つき","星":"ほし",
    "春":"はる","夏":"なつ","秋":"あき","冬":"ふゆ","正月":"しょうがつ","節分":"せつぶん",
    "餅":"もち","柿":"かき","栗":"くり","芋":"いも","米":"こめ","茶":"ちゃ","酒":"さけ",
    "傘":"かさ","舟":"ふね","船":"ふね","駅":"えき","家":"いえ","庭":"にわ","窓":"まど",
    "着物":"きもの","盆栽":"ぼんさい","茶道":"さどう","歌舞伎":"かぶき","漬物":"つけもの",
    "誕生日":"たんじょうび","喫茶店":"きっさてん","干し柿":"ほしがき","漢字":"かんじ",
    "計算":"けいさん","言葉":"ことば","動物":"どうぶつ","風景":"ふうけい","食":"たべもの",
    "行事":"ぎょうじ","初級":"やさしい","上級":"むずかしい",
    "焼":"やき","煮":"に","揚":"あげ","汁":"しる","鍋":"なべ","湯":"ゆ","豆":"まめ",
    "卵":"たまご","団子":"だんご","寿司":"すし","弁当":"べんとう","饅":"まん","菓子":"かし",
    "野菜":"やさい","果物":"くだもの","果":"くだもの","味":"あじ","料理":"りょうり",
    "祭":"まつり","花火":"はなび","風鈴":"ふうりん","団扇":"うちわ","扇":"おうぎ",
    "縁側":"えんがわ","囲炉裏":"いろり","障子":"しょうじ","神社":"じんじゃ","寺":"てら",
    "城":"しろ","橋":"はし","道":"みち","畑":"はたけ","田":"た","稲":"いね","麦":"むぎ",
    "温泉":"おんせん","風呂":"ふろ","電車":"でんしゃ","汽車":"きしゃ","自転車":"じてんしゃ",
    "帽子":"ぼうし","眼鏡":"めがね","時計":"とけい","電話":"でんわ","手紙":"てがみ",
    "子供":"こども","女":"おんな","男":"おとこ","老":"ろう","朝":"あさ","昼":"ひる","夜":"よる",
    "紅葉":"もみじ","落葉":"おちば","若葉":"わかば","竹":"たけ","松":"まつ","柳":"やなぎ",
    "実":"み","種":"たね","苗":"なえ","池":"いけ","滝":"たき","岩":"いわ","砂":"すな",
    "雲":"くも","風":"かぜ","虹":"にじ","氷":"こおり","炭":"すみ","火":"ひ","水":"みず"
  };
  const YOMI_KEYS = Object.keys(YOMI).sort((a, b) => b.length - a.length);
  function withYomi(t) {
    let add = "";
    YOMI_KEYS.forEach(k => { if (t.indexOf(k) >= 0) add += YOMI[k]; });
    return t + add;
  }
  function toKana(t) {
    let s = String(t);
    YOMI_KEYS.forEach(k => { s = s.split(k).join(YOMI[k]); });
    return s;
  }
  function matchQ(n) {
    if (!qWord) return true;
    const base = [n.title, n.genre, n.season, n.diff, kindOf(n)].join(" ");
    // 漢字のまま・ぜんぶ読み仮名にしたもの、両方を用意して照合します
    const hay = normQ(base) + "|" + normQ(toKana(base)) + "|" + normQ(withYomi(base));
    const words = qWord.trim().split(/[\s,、]+/).filter(Boolean);
    if (!words.length) return true;
    return words.every(w => hay.indexOf(normQ(w)) >= 0 || hay.indexOf(normQ(toKana(w))) >= 0);
  }

  function currentShown() {
    if (page === "fav") {
      const f = loadFav();
      return list.filter(n => f.includes(n.file)).filter(matchQ);
    }
    if (page === "calendar") {
      if (!calMonth) return [];
      return kindSubset().filter(n => calKey(n) === calMonth && !n.member)
        .slice().sort((a, b) => String(a.title).localeCompare(String(b.title), "ja"));
    }
    return kindSubset().filter(n => (page === "member" ? true : !n.member)).filter(matchQ).filter(n =>
      (!selSeason || n.season === selSeason) &&
      (!selGenre || n.genre === selGenre) &&
      (!selDiff || n.diff === selDiff) &&
      (!selUsed ||
       (selUsed === "使用済み" && isUsed(n.file)) ||
       (selUsed === "未使用" && !isUsed(n.file))));
  }

  function render() {
    const nFav = loadFav().length;
    document.getElementById("tabNoutore").classList.toggle("active", page === "noutore");
    document.getElementById("tabList").classList.toggle("active", page === "list");
    const tm = document.getElementById("tabMember");
    tm.style.display = MEMBER_TAB ? "" : "none";
    tm.classList.toggle("active", page === "member");
    const tf = document.getElementById("tabFav");
    tf.classList.toggle("active", page === "fav");
    tf.textContent = "★ お気に入り" + (nFav ? " (" + nFav + ")" : "");

    const PAGE_INTRO = {
      list: "高齢者向けの無料塗り絵です。デイサービスや介護施設のレクリエーションで使いやすいよう、A4サイズで印刷できます。季節の花、風景、食べ物、年中行事などから選べます。",
      noutore: "難読漢字、計算問題、ことわざ、言葉探しなど、高齢者向けの脳トレプリントを無料で配布しています。すべて答え付きです。"
    };
    const intro = document.getElementById("pageIntro");
    const introTxt = (!seriesView && !qWord && PAGE_INTRO[page]) || "";
    intro.textContent = introTxt;
    intro.style.display = introTxt ? "" : "none";

    // 検索欄 (カレンダーの月一覧では出さない)
    const sBar = document.getElementById("searchBar");
    const qEl = document.getElementById("q");
    sBar.style.display = (page === "calendar") ? "none" : "flex";
    if (qEl.value !== qWord) qEl.value = qWord;
    qEl.classList.toggle("on", !!qWord);
    document.getElementById("qClear").classList.toggle("show", !!qWord);

    buildToolbar();

    const hist = loadHist();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    if (page === "calendar" && !calMonth) {
      const months = [];
      kindSubset().forEach(n => {
        const k = calKey(n);
        let m = months.find(x => x.key === k);
        if (!m) { m = { key: k, year: n.year || 0, month: n.month || 0, count: 0, label: calLabel(n) }; months.push(m); }
        m.count++;
      });
      months.sort((a, b) => (a.year - b.year) || (a.month - b.month));
      document.getElementById("count").textContent = "";
      renderPager(1);
      const empty = document.getElementById("empty");
      empty.style.display = months.length ? "none" : "block";
      empty.textContent = "カレンダーはまだありません";
      document.getElementById("bulkBar").classList.remove("show");
      months.forEach(m => {
        const b = document.createElement("button");
        b.className = "month-btn";
        b.innerHTML = "📅 " + m.label + '<span class="mcount">' + m.count + " 枚</span>";
        b.onclick = () => { calMonth = m.key; curPage = 1; pushNav(); render(); };
        grid.appendChild(b);
      });
      return;
    }

    let all = currentShown();

    const seriesCounts = {};
    let seriesGrouped = false;
    // シリーズにまとめるのは脳トレだけ (塗り絵はすべて単独で表示)
    // キーワード検索中は、探しているものが埋もれないよう1枚ずつ出します
    const useSeries = !qWord && ((page === "noutore") ||
      (page === "member" && memberKind === "脳トレ"));
    if (useSeries) {
      if (seriesView) {
        all = all.filter(n => seriesBase(n.title) === seriesView)
                 .slice().sort((a, b) =>
                   (seriesNum(a.title) - seriesNum(b.title)) ||
                   (list.indexOf(b) - list.indexOf(a)));
      } else {
        seriesGrouped = true;
        const groups = new Map();
        all.forEach(n => {
          const b = seriesBase(n.title);
          if (!groups.has(b)) groups.set(b, []);
          groups.get(b).push(n);
        });
        all = [];
        groups.forEach((arr, b) => {
          seriesCounts[b] = arr.length;
          arr.sort((a, c) =>
            (seriesNum(a.title) - seriesNum(c.title)) ||
            (list.indexOf(c) - list.indexOf(a)));
          all.push(arr[0]);
        });
      }
    }

    const totalPages = Math.max(1, Math.ceil(all.length / PER_PAGE));
    if (curPage > totalPages) curPage = totalPages;
    if (curPage < 1) curPage = 1;
    const shown = all.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);

    document.getElementById("count").textContent =
      all.length
        ? (qWord ? "「" + qWord.trim() + "」の検索結果 " : "") + all.length + " 枚あります" +
          (totalPages > 1 ? "(" + curPage + " / " + totalPages + " ページ)" : "")
        : "";
    renderPager(totalPages);
    const empty = document.getElementById("empty");
    empty.style.display = all.length ? "none" : "block";
    empty.textContent = qWord
      ? "「" + qWord.trim() + "」に当てはまる作品は見つかりませんでした"
      : page === "member"
      ? "会員専用コンテンツはまだありません"
      : page === "fav"
      ? "お気に入りはまだありません(カード右上の ☆ を押すと登録できます)"
      : (page === "noutore"
        ? "この条件の脳トレはまだありません"
        : (page === "calendar"
          ? "カレンダーはまだありません"
          : "この条件の塗り絵はまだありません"));

    document.getElementById("bulkBar").classList.toggle("show", page === "fav" && all.length > 0);

    shown.forEach(n => {
      const sBase = seriesBase(n.title);
      const sCount = seriesGrouped ? (seriesCounts[sBase] || 1) : 1;
      if (sCount > 1) {
        const card = document.createElement("div");
        card.className = "card";
        const openSeries = () => {
          seriesView = sBase;
          curPage = 1;
          pushNav();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const img = document.createElement("img");
        img.src = imgPath(n, n.file);
        img.alt = sBase;
        img.onerror = () => {
          if (!img.dataset.retry) {
            // 古いキャッシュが残っている場合に備えて、キャッシュを無視して1回だけ読み直す
            img.dataset.retry = "1";
            img.src = imgPath(n, n.file) + "?r=" + Date.now();
            return;
          }
          thumb.innerHTML = '<div class="noimg">画像が見つかりません<br>(' + n.file + ')</div>';
        };
        img.onclick = openSeries;
        thumb.appendChild(img);
        const meta = document.createElement("div");
        meta.className = "meta";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = sBase;
        const tags = document.createElement("div");
        tags.className = "tags";
        tags.innerHTML =
          (kindOf(n) === "脳トレ" ? '<span class="tag kind">脳トレ</span>' : '') +
          (n.genre ? '<span class="tag genre">' + n.genre + '</span>' : '') +
          '<span class="tag">シリーズ全' + sCount + '枚</span>';
        const btns = document.createElement("div");
        btns.className = "btns";
        const b = document.createElement("a");
        b.className = "btn-dl";
        b.textContent = "▶ " + sCount + "枚を見る";
        b.onclick = openSeries;
        btns.appendChild(b);
        meta.appendChild(title);
        meta.appendChild(tags);
        meta.appendChild(btns);
        card.appendChild(thumb);
        card.appendChild(meta);
        grid.appendChild(card);
        return;
      }
      const h = hist[n.file] || {};
      const card = document.createElement("div");
      card.className = "card";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = imgPath(n, n.file);
      img.alt = n.title;
      img.onerror = () => {
        if (!img.dataset.retry) {
          // 古いキャッシュが残っている場合に備えて、キャッシュを無視して1回だけ読み直す
          img.dataset.retry = "1";
          img.src = imgPath(n, n.file) + "?r=" + Date.now();
          return;
        }
        if (n.member) {
          clearMemberUnlock();
          thumb.innerHTML = '<div class="noimg">会員の確認が切れました<br>「🔒 会員専用」タブを押し直してください</div>';
        } else {
          thumb.innerHTML = '<div class="noimg">画像が見つかりません<br>(' + n.file + ')</div>';
        }
      };
      img.onclick = () => { openLightbox(n); pushNav(); };
      thumb.appendChild(img);

      const fav = document.createElement("button");
      fav.className = "fav-btn" + (isFav(n.file) ? " on" : "");
      fav.textContent = isFav(n.file) ? "★" : "☆";
      fav.title = page === "fav" ? "お気に入りから外す" : "お気に入りに登録/解除";
      fav.onclick = () => toggleFav(n.file);
      card.appendChild(fav);

      if (h.print || h.save) {
        const rb = document.createElement("div");
        rb.className = "used-ribbon";
        rb.textContent = "✓ 使用済み";
        card.appendChild(rb);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const title = document.createElement("div");
      title.className = "title";
      if (n.member) {
        title.textContent = n.title;
      } else {
        // 検索エンジン用の作品ページへの本物のリンク (クリック時は今まで通り拡大表示)
        const ta = document.createElement("a");
        ta.href = "works/" + encodeURIComponent(n.file.replace(/\.[^.]+$/, ""));
        ta.textContent = n.title;
        ta.style.color = "inherit";
        ta.style.textDecoration = "none";
        ta.onclick = (e) => { e.preventDefault(); openLightbox(n); pushNav(); };
        title.appendChild(ta);
      }
      const tags = document.createElement("div");
      tags.className = "tags";
      if (kindOf(n) === "カレンダー") {
        tags.innerHTML =
          '<span class="tag kind">カレンダー</span>' +
          (n.month ? '<span class="tag">' + n.month + '月</span>' : '');
      } else if (kindOf(n) === "脳トレ") {
        tags.innerHTML =
          (n.member ? '<span class="tag" style="background:#f3e2c0;color:#8a6410">🔒会員</span>' : '') +
          '<span class="tag kind">脳トレ</span>' +
          (n.genre ? '<span class="tag genre">' + n.genre + '</span>' : '') +
          (n.answer ? '<span class="tag">答え付き</span>' : '');
      } else {
        tags.innerHTML =
          (n.member ? '<span class="tag" style="background:#f3e2c0;color:#8a6410">🔒会員</span>' : '') +
          '<span class="tag season-' + n.season + '">' + n.season + '</span>' +
          (n.genre ? '<span class="tag genre">' + n.genre + '</span>' : '') +
          (n.diff ? '<span class="tag diff-' + n.diff + '">' + n.diff + '</span>' : '') +
          (n.answer ? '<span class="tag">答え付き</span>' : '');
      }

      const histBox = document.createElement("div");
      histBox.className = "history";
      const addBadge = (kind, label, date) => {
        const b = document.createElement("span");
        b.className = "hist-badge";
        b.title = "押すとこの記録を消します";
        b.textContent = label + " " + date;
        b.onclick = () => unmark(n.file, kind);
        histBox.appendChild(b);
      };
      if (h.print) addBadge("print", "🖨 印刷済", h.print);
      if (h.save) addBadge("save", "💾 保存済", h.save);

      const btns = document.createElement("div");
      btns.className = "btns";
      const d = document.createElement("a");
      d.className = "btn-dl";
      d.textContent = "💾 保存";
      d.href = imgPath(n, n.file);
      d.download = dlName(n);
      d.onclick = () => {
        mark(n.file, "save");
        showToast("保存しました。ブラウザ右上の ↓ マーク →「フォルダに表示」で保存先が開けます");
        setTimeout(render, 100);
      };
      btns.appendChild(d);
      if (n.answer) {
        const da = document.createElement("a");
        da.className = "btn-ans";
        da.textContent = "💾 答え";
        da.href = imgPath(n, n.answer);
        da.download = dlNameAns(n);
        da.onclick = () => {
          showToast("答えを保存しました");
        };
        btns.appendChild(da);
      }

      meta.appendChild(title);
      meta.appendChild(tags);
      meta.appendChild(histBox);
      meta.appendChild(btns);
      card.appendChild(thumb);
      card.appendChild(meta);
      grid.appendChild(card);
    });
  }

  function dlName(n) {
    const d = (kindOf(n) === "脳トレ") ? "" : (n.diff ? "(" + n.diff + ")" : "");
    return n.title + d + n.file.substring(n.file.lastIndexOf("."));
  }
  function dlNameAns(n) {
    const d = (kindOf(n) === "脳トレ") ? "" : (n.diff ? "(" + n.diff + ")" : "");
    return n.title + " 答え" + d + n.answer.substring(n.answer.lastIndexOf("."));
  }

  function renderPager(totalPages) {
    const pager = document.getElementById("pager");
    pager.innerHTML = "";
    if (totalPages <= 1) return;
    const go = (n) => {
      curPage = n;
      render();
      syncState();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    const prev = document.createElement("button");
    prev.textContent = "← 前へ";
    prev.disabled = curPage === 1;
    prev.onclick = () => go(curPage - 1);
    pager.appendChild(prev);
    for (let n = 1; n <= totalPages; n++) {
      const b = document.createElement("button");
      b.textContent = n;
      if (n === curPage) b.className = "cur";
      b.onclick = () => go(n);
      pager.appendChild(b);
    }
    const next = document.createElement("button");
    next.textContent = "次へ →";
    next.disabled = curPage === totalPages;
    next.onclick = () => go(curPage + 1);
    pager.appendChild(next);
  }

  const lb = document.getElementById("lightbox");
  let lbCurrent = null;
  let lbShowingAnswer = false;
  function lbUpdate() {
    const n = lbCurrent;
    const file = lbShowingAnswer ? n.answer : n.file;
    const li = document.getElementById("lbImg");
    li.onerror = () => {
      if (li.dataset.retry === file) return;
      li.dataset.retry = file;
      li.src = imgPath(n, file) + "?r=" + Date.now();
    };
    li.src = imgPath(n, file);
    document.getElementById("lbTitle").textContent =
      n.title + (lbShowingAnswer ? " 答え" : "") + ((n.diff && kindOf(n) !== "脳トレ") ? "(" + n.diff + ")" : "");
    const save = document.getElementById("lbSave");
    save.href = imgPath(n, file);
    save.download = lbShowingAnswer ? dlNameAns(n) : dlName(n);
    const tg = document.getElementById("lbAnswer");
    tg.style.display = n.answer ? "inline-block" : "none";
    tg.textContent = lbShowingAnswer ? "問題に戻る" : "答えを見る";
  }
  function openLightbox(n) {
    lbCurrent = n;
    lbShowingAnswer = false;
    lbUpdate();
    lb.classList.add("show");
  }
  function closeLightbox() {
    lb.classList.remove("show");
    lbCurrent = null;
  }
  document.getElementById("lbAnswer").onclick = () => {
    if (!lbCurrent || !lbCurrent.answer) return;
    lbShowingAnswer = !lbShowingAnswer;
    lbUpdate();
  };
  lb.onclick = e => { if (e.target === lb) lbSmartClose(); };
  document.getElementById("lbClose").onclick = lbSmartClose;
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && lb.classList.contains("show")) lbSmartClose();
  });
  document.getElementById("lbSave").onclick = () => {
    if (!lbCurrent) return;
    if (!lbShowingAnswer) mark(lbCurrent.file, "save");
    showToast((lbShowingAnswer ? "答えを" : "") + "保存しました。ブラウザ右上の ↓ マーク →「フォルダに表示」で保存先が開けます");
    setTimeout(render, 100);
  };

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 5000);
  }

  const FOLDER_NAME = "介護のレクプリ";

  function idbOpen(name) {
    return new Promise((res, rej) => {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(dbName, k) {
    const db = await idbOpen(dbName);
    return new Promise((res, rej) => {
      const rq = db.transaction("kv").objectStore("kv").get(k);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  async function idbSet(dbName, k, v) {
    const db = await idbOpen(dbName);
    return new Promise((res, rej) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function ensurePerm(handle, mode) {
    try {
      if ((await handle.queryPermission({ mode: mode })) === "granted") return true;
      return (await handle.requestPermission({ mode: mode })) === "granted";
    } catch (e) { return false; }
  }

  async function fetchImageBlob(file, member) {
    const r = await fetch((member ? "member-img/" : "images/") + file);
    if (!r.ok) throw new Error("読み込めません: " + file);
    return await r.blob();
  }

  // ZIPを作る部品 (外部の部品を使わないので、どの環境でも動きます)
  function crc32(buf) {
    let table = crc32.t;
    if (!table) {
      table = crc32.t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        table[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0, cdSize = 0;
    const d = new Date();
    const t = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
    const dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    files.forEach(f => {
      const nb = enc.encode(f.name);
      const crc = crc32(f.data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, t, true); lh.setUint16(12, dt, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, f.data.length, true); lh.setUint32(22, f.data.length, true);
      lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nb, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, t, true); ch.setUint16(14, dt, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, f.data.length, true); ch.setUint32(24, f.data.length, true);
      ch.setUint16(28, nb.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nb);
      cdSize += 46 + nb.length;
      offset += 30 + nb.length + f.data.length;
    });
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
    eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
    eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true); eo.setUint16(20, 0, true);
    return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), { type: "application/zip" });
  }

  // 1枚ずつ連続ダウンロード (最後の手段)
  function bulkDownloadFallback(shown) {
    shown.forEach((n, i) => {
      setTimeout(() => {
        const a = document.createElement("a");
        a.href = imgPath(n, n.file);
        a.download = dlName(n);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }, i * 400);
    });
    shown.forEach(n => mark(n.file, "save"));
    showToast("保存を始めました。「複数のファイルのダウンロード」を聞かれたら「許可」を押してください");
    setTimeout(render, shown.length * 400 + 100);
  }

  // まとめて保存 その2: 1つのZIPにまとめて保存 (どのパソコン・ブラウザでも動きます)
  async function bulkZipSave(shown) {
    showToast("画像をまとめています。しばらくお待ちください…");
    const files = [];
    const used = {};
    const uniq = (name) => {
      if (!used[name]) { used[name] = 1; return name; }
      const i = name.lastIndexOf(".");
      const stem = i >= 0 ? name.slice(0, i) : name;
      const ext = i >= 0 ? name.slice(i) : "";
      return stem + "(" + (++used[name]) + ")" + ext;
    };
    const add = async (file, name, member) => {
      const b = await fetchImageBlob(file, member);
      files.push({ name: FOLDER_NAME + "/" + uniq(name), data: new Uint8Array(await b.arrayBuffer()) });
    };
    let ok = 0;
    for (const n of shown) {
      try {
        await add(n.file, dlName(n), n.member);
        if (n.answer) await add(n.answer, dlNameAns(n), n.member);
        mark(n.file, "save");
        ok++;
        if (shown.length > 5) {
          showToast("画像をまとめています… " + ok + " / " + shown.length + " 枚");
        }
      } catch (e) {}
    }
    if (!ok) {
      showToast("保存できませんでした。通信の状態を確かめて、もう一度お試しください");
      return;
    }
    const blob = makeZip(files);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    // ファイル名は半角にしておく (日本語名を落としてしまうブラウザがあるため)
    a.download = "kaigo-no-rekupuri.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    render();
    showToast(ok + " 枚を1つにまとめて保存しました(kaigo-no-rekupuri.zip)。右クリック →「すべて展開」で「" + FOLDER_NAME + "」フォルダが出てきます");
  }

  // まとめて保存 その1: 選んだフォルダにそのまま保存
  async function bulkFolderSave(parent, shown) {
    const dest = await parent.getDirectoryHandle(FOLDER_NAME, { create: true });
    let ok = 0;
    const writeOne = async (file, name, member) => {
      const blob = await fetchImageBlob(file, member);
      const fh = await dest.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(blob);
      await w.close();
    };
    for (const n of shown) {
      try {
        await writeOne(n.file, dlName(n), n.member);
        if (n.answer) await writeOne(n.answer, dlNameAns(n), n.member);
        mark(n.file, "save");
        ok++;
      } catch (e) {}
    }
    render();
    if (ok > 0) showToast(ok + " 枚を「" + parent.name + "」の中の「" + FOLDER_NAME + "」フォルダに保存しました");
    else showToast("保存できませんでした。もう一度お試しください");
    return ok;
  }

  // まとめて保存は ZIP 一本。
  // フォルダ選択(File System Access API)はパソコンやブラウザによって
  // 許可の出方が変わり、分かりにくい表示が出ることがあったため使いません。
  document.getElementById("bulkSave").onclick = async () => {
    const shown = currentShown();
    if (!shown.length) return;
    const btn = document.getElementById("bulkSave");
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      await bulkZipSave(shown);
    } catch (e) {
      showToast("保存できませんでした。お手数ですが1枚ずつ「保存」を押してください");
    } finally {
      btn.disabled = false;
    }
  };

  // ---- 検索欄の操作 ----
  (function () {
    const qEl = document.getElementById("q");
    let timer = null;
    const apply = (v) => {
      if (v === qWord) return;
      qWord = v;
      seriesView = null;
      curPage = 1;
      render();
      syncState();
    };
    qEl.addEventListener("input", () => {
      if (timer) clearTimeout(timer);
      const v = qEl.value;
      timer = setTimeout(() => apply(v), 250);
    });
    qEl.addEventListener("keydown", e => {
      if (e.key === "Enter") { if (timer) clearTimeout(timer); apply(qEl.value); qEl.blur(); }
      if (e.key === "Escape") { if (timer) clearTimeout(timer); qEl.value = ""; apply(""); }
    });
    document.getElementById("qClear").onclick = () => {
      if (timer) clearTimeout(timer);
      qEl.value = "";
      apply("");
      qEl.focus();
    };
  })();

  function switchPage(p) {
    const clean = !seriesView && !calMonth && !selSeason && !selGenre &&
                  !selDiff && !selUsed && !qWord && curPage === 1;
    if (p === page && clean) { render(); return; }
    seriesView = null;
    page = p;
    qWord = "";
    selSeason = selGenre = selDiff = selUsed = null;
    curPage = 1;
    calMonth = null;
    render();
    pushNav();
  }

  // ==========================================================
  //  戻るボタンで1段階ずつ戻れるようにする (履歴管理)
  // ==========================================================
  let navDepth = 0;
  function currentStateObj() {
    return {
      d: navDepth,
      page: page,
      seriesView: seriesView,
      calMonth: calMonth,
      curPage: curPage,
      selSeason: selSeason,
      selGenre: selGenre,
      selDiff: selDiff,
      selUsed: selUsed,
      memberKind: memberKind,
      q: qWord,
      lb: (lbCurrent && lb.classList.contains("show")) ? lbCurrent.file : null
    };
  }
  function pushNav() {
    navDepth++;
    try { history.pushState(currentStateObj(), ""); } catch (e) {}
  }
  function syncState() {
    try { history.replaceState(currentStateObj(), ""); } catch (e) {}
  }
  function lbSmartClose() {
    if (navDepth > 0 && history.state && history.state.lb) { history.back(); }
    else { closeLightbox(); syncState(); }
  }
  function applyState(st) {
    page = st.page || "list";
    seriesView = st.seriesView || null;
    calMonth = st.calMonth || null;
    curPage = st.curPage || 1;
    selSeason = st.selSeason || null;
    selGenre = st.selGenre || null;
    selDiff = st.selDiff || null;
    selUsed = st.selUsed || null;
    memberKind = st.memberKind || "塗り絵";
    qWord = st.q || "";
    if (page === "member" && !memberLoaded) {
      if (isMemberUnlocked()) { loadMemberList().then(() => render()); }
      else { page = "list"; }
    }
    render();
    if (st.lb) {
      const n = list.find(x => x.file === st.lb);
      if (n) {
        lbCurrent = n;
        lbShowingAnswer = false;
        lbUpdate();
        lb.classList.add("show");
      } else {
        closeLightbox();
      }
    } else if (lb.classList.contains("show")) {
      closeLightbox();
    }
  }
  document.getElementById("tabNoutore").onclick = () => switchPage("noutore");
  document.getElementById("tabList").onclick = () => switchPage("list");
  document.getElementById("tabFav").onclick = () => switchPage("fav");
  const APPLY_KEY = "nurie_apply_v1";
  document.getElementById("tabApply").onclick = async () => {
    let done = false;
    try { done = localStorage.getItem(APPLY_KEY) === "yes"; } catch (e) {}
    if (done) {
      showToast("まだ開設していません");
      return;
    }
    try { fetch("api/member-apply", { method: "POST" }); } catch (e) {}
    try { localStorage.setItem(APPLY_KEY, "yes"); } catch (e) {}
    showToast("まだ開設していません");
  };
  document.getElementById("tabMember").onclick = async () => {
    if (!isMemberUnlocked() && !(await unlockMember())) return;
    if (!memberLoaded) {
      let st = await loadMemberList();
      if (st === "auth") {
        clearMemberUnlock();
        if (!(await unlockMember())) return;
        st = await loadMemberList();
      }
      if (st !== "ok") {
        alert("会員コンテンツを読み込めませんでした。もう一度お試しください");
        return;
      }
    }
    switchPage("member");
  };

  if (isMemberUnlocked()) {
    loadMemberList().then(st => {
      if (st === "auth") clearMemberUnlock();
      else if (st === "ok") render();
    });
  }
  if (window.matchMedia && window.matchMedia("(max-width: 600px)").matches) {
    document.getElementById("tabList").textContent = "塗り絵";
    document.getElementById("tabNoutore").textContent = "脳トレ";
  }
  const qp = new URLSearchParams(location.search).get("page");
  if (qp === "noutore" || qp === "calendar" || qp === "fav") page = qp;
  const basePage = page;
  window.addEventListener("popstate", e => {
    const st = e.state || { page: basePage, d: 0 };
    navDepth = st.d || 0;
    applyState(st);
  });
  const hs0 = history.state;
  if (hs0 && hs0.page) {
    // 再読み込みや「TOPから戻ってきた」ときは、前回見ていた画面を復元する
    navDepth = hs0.d || 0;
    applyState(hs0);
  } else {
    try { history.replaceState(currentStateObj(), ""); } catch (e) {}
    render();
  }
})();
</script>
</body>
</html>
