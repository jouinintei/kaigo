    document.title=M[0];set('meta[name="description"]',"content",M[1]);set('meta[property="og:title"]',"content",M[0]);set('meta[property="og:description"]',"content",M[1]);
    set('link[rel="canonical"]',"href","https://rekupuri.com/"+M[2]);set('meta[property="og:url"]',"content","https://rekupuri.com/"+M[2]);
    if(K==="fav")set('meta[name="robots"]',"content","noindex");})();

  const st={season:qs.get("s")||qs.get("season")||"すべて",genre:qs.get("genre")||"",diff:"",q:qs.get("q")||"",sort:["new","pop","rand"].includes(qs.get("sort"))?qs.get("sort"):"new",page:1,month:null,sel:new Set(),unused:false};try{st.unused=localStorage.getItem("rk_unused")==="1";}catch(e){}
  let pop=[],seed=Math.random()*1e9|0;
  fetch((location.pathname.indexOf("/preview/")<0?"/":"../")+"api/popular",{cache:"no-store"}).then(r=>r.json()).then(j=>{pop=(j&&j.files)||[];if(st.sort==="pop")render();}).catch(()=>{});
  const rk=f=>{let h=seed;for(let i=0;i<f.length;i++)h=Math.imul(h^f.charCodeAt(i),2654435761);return (h>>>0);};
  const PER=K==="cal"?12:12;
  const SEASONS=["すべて","春","夏","秋","冬","通年"];
  const title={nurie:["塗り絵を探す","季節やジャンルから選べます。画像を押すと拡大し、色見本も見られます。"],noutore:["脳トレを探す","漢字・計算・言葉遊びのプリント。すべて答えつきです。"],cal:["塗り絵カレンダー","その月の絵柄を塗って仕上げる月間カレンダーです。"],wall:["壁紙作り","みんなで塗って、つなげると壁一面の作品になる大きな塗り絵です。"],fav:["お気に入り","選んだ素材をまとめて保存できます。"]}[K];
  const items=()=>LIST.filter(n=>kindOf(n)===KIND);
  const genres=()=>[...new Set(items().map(n=>n.genre).filter(Boolean))];
  let YOMI={},YK=[],AUTO_T={};
  fetch("https://img.rekupuri.com/search/yomi.json",{mode:"cors"}).then(r=>r.ok?r.json():null).then(j=>{if(!j)return;AUTO_T=j.t||{};YOMI=j.w||{};YK=Object.keys(YOMI).sort((a,b)=>b.length-a.length);if(st.q)render();}).catch(()=>{});
  const withYomi=t=>{let a="";YK.forEach(k=>{if(t.indexOf(k)>=0)a+=YOMI[k];});return t+a;};
  const toKana=t=>{let s=String(t);YK.forEach(k=>{s=s.split(k).join(YOMI[k]);});return s;};
  // 表記ゆれ（同じ意味の言葉）をまとめて検索する
  const SYN=[["もみじ","紅葉","こうよう"],["さくら","桜"],["ひまわり","向日葵"],["あじさい","紫陽花"],["すいか","西瓜"],["かぼちゃ","南瓜","パンプキン"],["ねこ","猫"],["いぬ","犬"],["つきみ","月見","お月見","十五夜"],["しょうがつ","正月","お正月","新年"],["ひなまつり","ひな祭り","雛祭り","桃の節句"],["こどもの日","子供の日","子どもの日","端午","こいのぼり","鯉のぼり"],["たなばた","七夕"],["うめ","梅"],["つばき","椿"],["ぼたん","牡丹"],["しゃくやく","芍薬"],["ゆり","百合"],["きもの","着物","和服"],["けいろう","敬老"],["せつぶん","節分","豆まき"],["はなみ","花見","お花見"],["うんどうかい","運動会"],["きんぎょ","金魚"],["はなび","花火"],["あさがお","朝顔"],["ほたる","蛍"],["ゆきだるま","雪だるま"],["ふじさん","富士山"],["おにぎり","おむすび"],["さんま","秋刀魚"],["とんぼ","蜻蛉"],["ちょう","蝶","ちょうちょ"],["たんぽぽ","蒲公英"],["すすき","芒","薄"],["こすもす","コスモス","秋桜"]];
  const synOf=w=>{const nw=norm(w);const g=SYN.find(g=>g.some(x=>norm(x)===nw));return g||[w];};
  const norm=s=>String(s).normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,"");
  const hira=s=>String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  function filtered(){
    let a=items();
    if((K==="nurie"||K==="wall")&&st.season!=="すべて")a=a.filter(n=>n.season===st.season);
    if(st.genre)a=a.filter(n=>n.genre===st.genre);
    if(st.diff)a=a.filter(n=>n.diff===st.diff);
    if(st.unused)a=a.filter(n=>!RK.isUsed(n.file));
    if(st.q){const ws=st.q.trim().split(/[\s,、]+/).filter(Boolean);a=a.filter(n=>{const b=[n.title,n.genre,n.season,n.diff].join(" ");const hay=norm(b)+"|"+norm(toKana(b))+"|"+norm(withYomi(b))+"|"+norm(AUTO_T[n.file]||"");return ws.every(w=>synOf(w).some(v=>hay.includes(norm(v))||hay.includes(norm(toKana(v)))));});}
    window.RK_CTX=(()=>{const c={};if((K==="nurie"||K==="wall")&&st.season!=="すべて")c.se=st.season;if(st.genre)c.ge=st.genre;if(st.diff)c.di=st.diff;if(st.q&&st.q.trim())c.q=st.q.trim().slice(0,30);if(st.unused)c.us="未使用だけ";if(K!=="cal")c.so=st.sort;return c;})();window.RK_SORT=K!=="cal"?st.sort:"";
    if(st.sort==="pop"){const r=new Map(pop.map((f,i)=>[f,i]));a=a.map((n,i)=>[r.has(n.file)?r.get(n.file):1e6+i,n]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
    else if(st.sort==="rand"){a=a.map(n=>[rk(n.file),n]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
    return a;
  }
  function pager(total){
    const pages=Math.ceil(total/PER);if(pages<=1)return"";
    const p=st.page,nums=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-p)<=1)nums.push(i);else if(nums[nums.length-1]!=="…")nums.push("…");}
    return `<nav class="pg" aria-label="ページ送り"><button data-pg="${p-1}" ${p===1?"disabled":""}>← 前へ</button>${nums.map(i=>i==="…"?'<span class="dots">…</span>':`<button data-pg="${i}"${i===p?' aria-current="page"':""}>${i}</button>`).join("")}<button data-pg="${p+1}" ${p===pages?"disabled":""}>次へ →</button></nav><p class="pginfo">${total}枚中 ${(p-1)*PER+1}〜${Math.min(p*PER,total)}枚目</p>`;
  }
  const head=()=>`<div class="ph1"><div><h1>${title[0]}</h1><p>${title[1]}</p></div>${K==="nurie"?`<label class="search">${ico("search",18)}<span class="sr">作品名・キーワード</span><input type="search" id="q" placeholder="作品名・キーワード" value="${esc(st.q)}"></label>`:""}</div>`;
  function filters(){
    if(K==="nurie")return `<div class="fl"><div class="chr">${SEASONS.map(s=>`<button class="chip" data-season="${s}" aria-pressed="${st.season===s}">${s}</button>`).join("")}</div><span class="sp"></span><div class="slr">
<label><span class="sr">ジャンル</span><select class="sel" id="genre"><option value="">ジャンル：すべて</option>${genres().map(g=>`<option value="${g}"${st.genre===g?" selected":""}>ジャンル：${g}</option>`).join("")}</select></label>
<label><span class="sr">難しさ</span><select class="sel" id="diff"><option value="">難しさ：すべて</option>${["初級","中級","上級"].map(g=>`<option value="${g}"${st.diff===g?" selected":""}>難しさ：${g}</option>`).join("")}</select></label><button class="uchk" data-unused aria-pressed="${st.unused}"><span class="bx">${st.unused?ico("check",15):""}</span>まだ使っていないものだけ</button></div></div>`;
    if(K==="wall")return `<div class="fl"><div class="chr">${SEASONS.map(s=>`<button class="chip" data-season="${s}" aria-pressed="${st.season===s}">${s}</button>`).join("")}</div></div>`;
    if(K==="noutore")return `<div class="fl"><div class="chr"><button class="chip" data-genre="" aria-pressed="${!st.genre}">すべて</button>${genres().map(g=>`<button class="chip" data-genre="${g}" aria-pressed="${st.genre===g}">${g}</button>`).join("")}</div><span class="sp"></span><div class="slr"><button class="uchk" data-unused aria-pressed="${st.unused}"><span class="bx">${st.unused?ico("check",15):""}</span>まだ使っていないものだけ</button></div></div>`;
    return "";
  }
  function countLine(tot){

  }
  let fopen=false;
  const narrow=()=>matchMedia("(max-width:640px)").matches;
  function ftoggle(){

    const bits=[];if((K==="nurie"||K==="wall")&&st.season!=="すべて")bits.push(st.season);if(st.genre)bits.push(st.genre);if(st.diff)bits.push(st.diff);if(st.q)bits.push("「"+st.q+"」");if(st.unused)bits.push("未使用");
    const b=document.createElement("button");b.type="button";b.className="ftg";b.dataset.ftg="";b.setAttribute("aria-expanded",String(fopen));

    const a=filtered(),tot=a.length,pages=Math.max(1,Math.ceil(tot/PER));if(st.page>pages)st.page=pages;
    const pageItems=a.slice((st.page-1)*PER,st.page*PER);
    main.innerHTML=head()+(K==="wall"?`<div class="wabout"><h3>分割塗り絵とは？</h3><p>1枚の大きな絵を、何枚かのA4用紙に分けた塗り絵です。一人1枚ずつ塗って、番号どおりにつなげると、壁一面の大きな作品になります。</p><p>保存・印刷すると、色を相談するための<b>全体図</b>と<b>分けた塗り絵</b>がまとめて出てきます。A4・実際のサイズ（100%）で印刷してください。</p><p><b>推奨人数</b>は、分けた紙の枚数と同じです（一人1枚）。</p><p>印刷すると紙のまわりに白いふちが出ます。<b>白いふちは、のりしろに使うか、切り取るかして</b>貼り合わせてください。</p><p class="wtry">壁紙作りはお試し中のコーナーです。使ってみた感想を、ぜひ<a href="/contact.html?type=壁紙作りの感想">お聞かせください</a>。仕上がった作品の写真も大歓迎です。</p></div>`:"")+filters()+`<div class="bar">${countLine(tot)}<div class="seg" role="group" aria-label="並び順">${[["new","新着順"],["pop","人気順"],["rand","ランダム"]].map(([v,t])=>`<button data-sort="${v}" aria-pressed="${st.sort===v}">${v==="rand"&&st.sort==="rand"?"もう一度まぜる":t}</button>`).join("")}</div></div>`+
      (tot?`<div class="grid">${pageItems.map(n=>card(n)).join("")}</div>${pager(tot)}`:
      `<div class="empty"><div class="ic">${ico("search",34)}</div><h3>条件に合う${KIND}は見つかりませんでした</h3><p style="color:var(--sub)">条件を減らすと見つかるかもしれません。</p><button class="btn p" data-reset>条件をリセット</button></div>`);
  }
  function renderCal(){
    const a=items(),groups={};a.forEach(n=>{const k=n.year+"-"+String(n.month).padStart(2,"0");(groups[k]=groups[k]||[]).push(n);});
    const keys=Object.keys(groups).sort();const now=new Date().toISOString().slice(0,7);
    if(!st.month)st.month=groups[now]?now:keys[keys.length-1];
    main.innerHTML=head()+`<div class="months" style="margin:20px 0 32px">${keys.map(k=>{const g=groups[k],m=+k.slice(5),n=g.find(x=>!/貼り付け|blank/.test(x.title+x.file))||g[0];return `<button class="mo" data-month="${k}" aria-current="${st.month===k}"><b>${m}<span style="font-size:14px">月</span></b>${k===now?'<span class="lbl season">今月</span>':""}<img loading="lazy" alt="" src="${RK.sthumb(n)}"><span style="font-size:12px;color:var(--mute)">${k.slice(0,4)}年・${g.length}種類</span></button>`;}).join("")}</div>
<div class="h2"><h2>${+st.month.slice(0,4)}年${+st.month.slice(5)}月のカレンダー</h2></div><div class="grid">${groups[st.month].map(n=>card(n)).join("")}</div>`;
  }
  const histBox=()=>`<div class="hreset"><h3>使用の記録</h3><p>このパソコン（ブラウザ）に残っている「保存した」「印刷した」の記録を消せます。消すと「使用済み」の印や「もう一度〜」の表示が元に戻ります。</p><div class="hr2"><button class="btn g" data-hreset="save">保存の記録をリセット</button>${RK.PT?`<button class="btn g" data-hreset="print">印刷の記録をリセット</button>`:""}</div></div>`;
  function renderFav(){
    const f=favs(),a=f.map(x=>LIST.find(n=>n.file===x)).filter(Boolean);
    if(!a.length){main.innerHTML=head()+`<div class="empty"><div class="ic">${ico("star",34)}</div><h3>お気に入りはまだありません</h3><p style="color:var(--sub)">素材の右上の星を押すと、ここに集まります。</p><a class="btn p" href="list.html?k=nurie">塗り絵を探す</a></div>`+histBox();return;}
    const sel=st.sel;[...sel].forEach(x=>{if(!f.includes(x))sel.delete(x)});
    main.innerHTML=head()+`<div class="bar"><div class="n"><div class="big"><b>${a.length}</b><span>件</span></div></div><button class="btn g" data-all>${sel.size===a.length?"選択を外す":"すべて選ぶ"}</button></div><div class="grid">${a.map(n=>card(n,{chk:true,on:sel.has(n.file)})).join("")}</div>
<div class="fbar"><span><b>${sel.size}</b> 枚を選択中</span><button class="btn p" data-bulk ${sel.size?"":"disabled"} style="height:50px">${ico("down",18)}選んだ${sel.size}枚をまとめて保存</button></div>`+histBox();
  }
  main.addEventListener("click",async e=>{
    const t=e.target.closest("button,[data-chk]");if(!t)return;
    if(t.dataset.ftg!==undefined){fopen=!fopen;render();}
    else if(t.dataset.season){st.season=t.dataset.season;st.page=1;render();}
    else if(t.dataset.genre!==undefined&&K==="noutore"){st.genre=t.dataset.genre;st.page=1;render();}
    else if(t.dataset.pg){st.page=+t.dataset.pg;render();const el=main.querySelector(".bar")||main.querySelector(".fl")||main;const hd=document.querySelector(".hd");const off=(hd&&getComputedStyle(hd).position==="sticky"?hd.offsetHeight:0)+12;scrollTo({top:el.getBoundingClientRect().top+scrollY-off,behavior:"smooth"});}
    else if(t.dataset.reset!==undefined){Object.assign(st,{season:"すべて",genre:"",diff:"",q:"",page:1,unused:false});try{localStorage.setItem("rk_unused","0");}catch(e){}render();}
    else if(t.dataset.sort){if(t.dataset.sort==="rand"&&st.sort==="rand")seed=Math.random()*1e9|0;st.sort=t.dataset.sort;st.page=1;render();}
    else if(t.dataset.unused!==undefined){st.unused=!st.unused;try{localStorage.setItem("rk_unused",st.unused?"1":"0");}catch(e){}st.page=1;render();}
    else if(t.dataset.clr){const k=t.dataset.clr;if(k==="season")st.season="すべて";else if(k==="unused"){st.unused=false;try{localStorage.setItem("rk_unused","0");}catch(e){}}else st[k]="";st.page=1;render();}
    else if(t.dataset.month){st.month=t.dataset.month;render();}
    else if(t.dataset.chk){st.sel.has(t.dataset.chk)?st.sel.delete(t.dataset.chk):st.sel.add(t.dataset.chk);render();}
    else if(t.dataset.all!==undefined){const f=favs();st.sel=st.sel.size===f.length?new Set():new Set(f);render();}
    else if(t.dataset.hreset){const k=t.dataset.hreset,nm=k==="save"?"保存":"印刷";if(!confirm(`${nm}の記録をすべて消しますか？\n（このパソコンの記録だけが消えます。元には戻せません）`))return;const n=RK.resetHist(k);render();RK.toast(`${nm}の記録をリセットしました`,n?`${n}件の記録を消しました`:"消す記録はありませんでした");}
    else if(t.dataset.bulk!==undefined){for(const f of st.sel){await RK.save(f,"bulk",null);await new Promise(r=>setTimeout(r,600));}RK.toast(`${st.sel.size}枚を保存しました`,"A4サイズで印刷してお使いください");}
  });
  main.addEventListener("change",e=>{if(e.target.id==="genre")st.genre=e.target.value;if(e.target.id==="diff")st.diff=e.target.value;st.page=1;render();});
  let qt;main.addEventListener("input",e=>{if(e.target.id!=="q")return;clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value;st.page=1;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos);},300);});
  document.addEventListener("favchange",()=>{if(K==="fav")render();});
  main.innerHTML=head()+filters()+`<div class="grid" style="margin-top:24px">${skeleton(6)}</div>`;
  let rdone=0;const go=()=>{if(!rdone){rdone=1;render();}};requestAnimationFrame(()=>setTimeout(go,50));setTimeout(go,400);
})();
</script>
