.hero .pw{flex-direction:column;align-items:stretch;justify-content:center;gap:0}.hero .pw .pics{flex:none;width:100%}.hero .cnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}.hero .cnav button{border:0;background:none;cursor:pointer;padding:6px;color:var(--sub);display:flex}.hero .cnav .ar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center}.hero .cnav .ar:hover{color:var(--btn);border-color:var(--btn)}.hero .dots{display:flex;gap:8px}.hero .dots button{width:9px;height:9px;padding:0;border-radius:50%;background:#D9D1C6}.hero .dots button[aria-current=true]{background:var(--acc);width:22px;border-radius:5px}.hero .ctl{font-family:var(--mincho);font-weight:700;font-size:15px;color:var(--ink);text-align:center;margin-top:4px;min-height:1.5em}

.entry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:64px}

.entry .cnt{font-family:var(--mincho);font-size:26px;font-weight:700;color:var(--btn);margin-left:12px}
.entry .cnt small{font-family:var(--gothic);font-size:14px;font-weight:500;margin-left:2px;color:var(--sub)}
.entry span.d{font-size:15px;color:var(--sub)}
.recs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.rec{text-decoration:none;color:var(--ink);border:0;background:none;padding:0;text-align:left;font:inherit;cursor:pointer}

.how{display:flex;gap:36px;flex-wrap:wrap;margin:0;padding:0;list-style:none}

}
@media (max-width:360px){.hero .brand{font-size:43px}.hero .fr{font-size:13px;letter-spacing:.04em}}

.tst{position:absolute;right:18px;top:56px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.18);background:#3A2A21;color:#fff;font-size:13.5px;border-radius:999px;padding:7px 16px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .3s .9s}.ill[data-s="1"] .tst{opacity:1}

.c1{left:calc(22px + 3*58px);top:28px}.c2{left:calc(50% + 70px);top:300px}
.pr{position:relative;height:250px;display:flex;align-items:flex-end;justify-content:center}
.mach{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:230px;height:90px;background:#E9E2D8;border-radius:14px;box-shadow:inset 0 -6px 0 #DCD3C7}.mach span{position:absolute;left:30px;right:30px;top:18px;height:8px;border-radius:4px;background:#C9BCAD}

.a4{position:absolute;right:calc(50% - 150px);top:6px;font:700 13px var(--gothic);color:var(--btn);border:1.5px solid var(--btn);border-radius:6px;padding:1px 8px}

.ab-b{background:#F3EDE3;border-radius:16px;padding:56px 40px;text-align:center}
