<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>介護のレクプリ｜高齢者向けの無料塗り絵・脳トレ・カレンダー（新デザイン確認用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1792554025">
<style>
.hero{padding:52px 0 64px;background-image:radial-gradient(rgba(120,100,80,.05) 1px,transparent 1px);background-size:6px 6px}
.hero .wrap{display:flex;gap:44px;align-items:stretch}
.hero .tx{flex:0 0 440px}
.hero .ey{font-size:14px;letter-spacing:.2em;color:var(--btn);font-weight:700}
.hero h1{margin:10px 0 14px;font-family:var(--mincho);font-size:42px;line-height:1.45;font-weight:700}
.hero p{margin:0;color:var(--sub)}
.hero .tx{display:flex;flex-direction:column;justify-content:center}
.hero form{display:flex;gap:8px}
.hero form .search{flex:1}
.hero .pw{flex:1;min-width:0;display:flex;align-items:center;gap:16px}
.hero .pics{position:relative;flex:1;height:330px;min-width:0}
.hero .pic{position:absolute;inset:0;border:0;background:none;padding:0;cursor:zoom-in}
.hero .pic:hover img.b{transform:rotate(2deg) translateY(-4px);box-shadow:0 16px 34px rgba(50,40,30,.14)}
.hero .pics img{transition:opacity .4s,transform .2s,box-shadow .2s}
.hero .pcap{flex:none;width:270px;display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:16px;position:relative;z-index:2}
.hero .pt{display:flex;flex-direction:column;gap:0;min-width:0;flex:1}
.hero .pt .lbl{align-self:flex-start}
.hero .pt b{font-family:var(--mincho);font-size:21px;line-height:1.4;white-space:nowrap;overflow:hidden}
.hero .pm{font-size:14px;color:var(--mute)}
.hero .pb{display:flex;flex-direction:column;gap:8px}
.hero .pb .btn{height:44px;padding:0 12px;font-size:15px;width:100%}
.hero .pics img{position:absolute;height:86%;width:auto;max-width:72%;object-fit:contain;aspect-ratio:1.414;object-fit:contain;background:#fff;padding:8px;border:1px solid var(--line);opacity:0;transition:opacity .4s}
.hero .pics img.on{opacity:1}
.hero .pics.tate img{aspect-ratio:.707}
.hero .pics.tate .a{left:18%}.hero .pics.tate .b{right:18%}
.hero .pics .a{left:0;top:0;transform:rotate(-3deg);box-shadow:0 6px 16px rgba(50,40,30,.06)}
.hero .pics .b{right:0;left:auto;top:14%;transform:rotate(2deg);box-shadow:0 12px 28px rgba(50,40,30,.10)}
.hero .stat{display:flex;gap:28px;margin-top:22px;color:var(--sub);font-size:14px}
.hero .stat b{font-family:var(--mincho);font-size:26px;color:var(--ink);margin-right:2px}
.entry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:64px}
.entry a{padding:26px 24px;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--ink);min-height:176px;transition:transform .15s,box-shadow .15s}
.entry a:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(50,40,30,.07);color:var(--ink)}
.entry .i{width:64px;height:64px;border-radius:16px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--btn)}
.entry .r{display:flex;justify-content:space-between;align-items:center;color:var(--btn)}
.entry b{font-family:var(--mincho);font-size:25px;display:block}
.entry .cnt{font-family:var(--mincho);font-size:26px;font-weight:700;color:var(--btn);margin-left:12px}
.entry .cnt small{font-family:var(--gothic);font-size:14px;font-weight:500;margin-left:2px;color:var(--sub)}
.entry span.d{font-size:15px;color:var(--sub)}
.recs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.rec{text-decoration:none;color:var(--ink);border:0;background:none;padding:0;text-align:left;font:inherit;cursor:pointer}
.rec .c{padding:10px;position:relative}
.rec img{display:block;width:100%;aspect-ratio:1.414;object-fit:contain;background:#fff;border-radius:4px}
.rec .lbl{position:absolute;right:16px;top:16px}
.rec b{display:block;margin-top:10px;font-size:16px}
.rec span.m{font-size:13px;color:var(--mute)}
.how{display:flex;gap:36px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.how li{display:flex;align-items:center;gap:12px;font-size:17px}
.how li span{width:36px;height:36px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.sec{margin-top:64px}
.about p{color:#4A423A;max-width:52em;margin:0}
@media (max-width:900px){.hero .wrap{flex-direction:column;align-items:stretch}.hero .tx{flex:none}.hero .pics{height:260px}.recs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .hero{padding:28px 0 24px}.hero h1{font-size:30px}.hero .pics{flex:none;height:230px}
  .hero .pw{flex-direction:column;align-items:stretch}.hero .pcap{width:auto}.hero .pb{flex-direction:row}.hero .pb .btn{flex:1}
  .entry{grid-template-columns:1fr;gap:12px;margin-bottom:44px}
  .entry a{flex-direction:row;align-items:center;min-height:0;padding:16px}
  .entry .r{order:2;margin-left:auto}.entry .i{width:54px;height:54px}
  .entry b{font-size:21px}
  .recs{gap:12px}.sec{margin-top:44px}
}

/* about/how variants */
.ab-a{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.ab-a .ph{position:relative;height:300px}
.ab-a .ph img{position:absolute;width:58%;aspect-ratio:1.414;object-fit:cover;background:#fff;padding:7px;border:1px solid var(--line);box-shadow:0 8px 20px rgba(50,40,30,.08)}
.ab-a .ph img:nth-child(1){left:0;top:0;transform:rotate(-3deg)}.ab-a .ph img:nth-child(2){right:4%;top:22%;transform:rotate(2deg)}.ab-a .ph img:nth-child(3){left:18%;bottom:0;transform:rotate(-1deg);width:46%}
.ab-a h2{font-family:var(--mincho);font-size:30px;line-height:1.5;margin:6px 0 14px}
.ey{font-size:13px;letter-spacing:.25em;color:var(--btn);font-weight:700}
.ab-a p{margin:0;color:#4A423A}
.steps-a{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:56px}
.steps-a li{list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 24px;position:relative;box-shadow:var(--shadow)}
.steps-a .num{font-family:var(--mincho);font-size:52px;line-height:1;color:var(--acc);opacity:.9}
.steps-a b{display:block;font-family:var(--mincho);font-size:21px;margin:10px 0 4px}
.steps-a span.d{font-size:15px;color:var(--sub)}
.steps-a li:not(:last-child)::after{content:"";position:absolute;right:-16px;top:50%;width:12px;height:12px;border-top:2px solid #D9CBB9;border-right:2px solid #D9CBB9;transform:translateY(-50%) rotate(45deg)}
.ab-b{background:#F3EDE3;border-radius:16px;padding:56px 40px;text-align:center}
.ab-b .q{font-family:var(--mincho);font-size:30px;line-height:1.7;margin:10px 0 18px}
.ab-b .q em{font-style:normal;color:var(--btn);background:linear-gradient(transparent 62%,#F6D9C4 62%)}
.ab-b p{max-width:40em;margin:0 auto;color:#4A423A}
.tl{display:flex;justify-content:center;gap:0;margin-top:40px;padding:0}
.tl li{list-style:none;flex:0 1 240px;position:relative;text-align:center}
.tl li::before{content:"";position:absolute;top:31px;left:-50%;width:100%;border-top:2px dashed #D9CBB9;z-index:0}
.tl li:first-child::before{display:none}
.tl .c{position:relative;z-index:1;width:64px;height:64px;border-radius:999px;background:#fff;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--btn)}
.tl b{display:block;font-size:17px}.tl span.d{font-size:14px;color:var(--sub)}
.ft3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ft3 .f{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center;box-shadow:var(--shadow)}
.ft3 .f .i{width:72px;height:72px;margin:0 auto 14px;border-radius:999px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--btn)}
.ft3 b{display:block;font-family:var(--mincho);font-size:22px;margin-bottom:6px}
.ft3 span{font-size:15px;color:var(--sub)}
.ab-c .lead{text-align:center;margin-bottom:28px}
.ab-c .lead h2{font-family:var(--mincho);font-size:30px;margin:6px 0 8px}
.ab-c .lead p{margin:0 auto;max-width:42em;color:#4A423A}
.st-c{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:48px;padding:0}
.st-c li{list-style:none}
.st-c .img{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.st-c .img img{max-height:100%;max-width:100%;object-fit:contain}
.st-c .n{position:absolute;left:12px;top:12px;width:36px;height:36px;border-radius:999px;background:var(--btn);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.st-c b{display:block;margin:12px 0 2px;font-size:18px}.st-c span{font-size:14px;color:var(--sub)}
.mock-btn{display:flex;flex-direction:column;gap:8px;width:70%}
.mock-btn .btn{height:40px;font-size:14px;pointer-events:none}
.ab-d{display:grid;grid-template-columns:260px 1fr;gap:20px 56px;border-top:1px solid var(--ink);padding-top:32px}
.ab-d .hd2 .en{font-size:13px;letter-spacing:.3em;color:var(--mute)}
.ab-d .hd2 h2{font-family:var(--mincho);font-size:28px;margin:6px 0 0;line-height:1.4}
.ab-d p{margin:0;color:#4A423A;font-size:17px;line-height:2}
.ab-d + .ab-d{margin-top:48px}
.st-d{margin:0;padding:0;display:flex;flex-direction:column}
.st-d li{list-style:none;display:grid;grid-template-columns:72px 1fr;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.st-d li:first-child{padding-top:0}
.st-d .n{font-family:var(--mincho);font-size:34px;color:var(--acc)}
.st-d b{font-size:19px}.st-d span{display:block;font-size:15px;color:var(--sub)}
@media (max-width:760px){.ab-a,.ab-d{grid-template-columns:1fr}.steps-a,.ft3,.st-c{grid-template-columns:1fr}.steps-a li::after{display:none}.tl{flex-direction:column;align-items:center;gap:18px}.tl li::before{display:none}.ab-b{padding:36px 20px}.ab-b .q{font-size:23px}}
</style>
</head>
<body>
<div id="hd"></div>
<main>
<section class="hero"><div class="wrap">
<div class="tx">
<div class="ey">無料・会員登録なし</div>
<h1>印刷して、すぐ使える<br>高齢者向けレク素材</h1>
<p>介護施設・デイサービス・ご家庭で使える塗り絵・脳トレ・カレンダーを、A4でそのまま印刷できます。</p>
</div>
<div class="pw"><div class="pics" id="pics"></div></div>
</div></section>

<div class="wrap">
<nav class="entry" aria-label="素材の種類">
<a class="card" href="list.html?k=nurie"><span class="r"><span class="i"><svg class="ico" style="width:32px;height:32px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg></span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span><b>塗り絵<span class="cnt" data-cnt="塗り絵"></span></b><span class="d">季節・ジャンル・難しさで選べる</span></span></a>
<a class="card" href="list.html?k=noutore"><span class="r"><span class="i"><svg class="ico" style="width:32px;height:32px" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></svg></span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span><b>脳トレ<span class="cnt" data-cnt="脳トレ"></span></b><span class="d">漢字・計算・言葉遊び。答えつき</span></span></a>
<a class="card" href="list.html?k=cal"><span class="r"><span class="i"><svg class="ico" style="width:32px;height:32px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span><b>カレンダー<span class="cnt" data-cnt="カレンダー"></span></b><span class="d">塗って飾れる月間カレンダー</span></span></a>
</nav>

<div id="abhow"></div>

<section class="sec"><div class="h2"><h2>おすすめの塗り絵</h2><span class="s">季節ものと、いつでも使えるものを半分ずつ</span><a class="more" href="list.html?k=nurie">すべて見る →</a></div><div class="recs" id="recs"></div></section>

<section class="sec"><div class="h2"><h2>新しく追加した素材</h2><a class="more" href="list.html?k=nurie">一覧へ →</a></div><div class="recs" id="news"></div></section>

</div>
</main>
<div id="ft"></div>
<script src="../data.js"></script>
<script src="app.js?v=1792554025"></script>
<script>
(function(){
  const {LIST,kindOf,thumb,full,esc,seasonNow,metaOf}=RK;
  document.getElementById("hd").innerHTML=RK.header("");
  document.getElementById("ft").innerHTML=RK.footer("");
  RK.updFavCount();
  const nu=LIST.filter(n=>kindOf(n)==="塗り絵");
  const c=k=>LIST.filter(n=>kindOf(n)===k).length;
  document.querySelectorAll("[data-cnt]").forEach(e=>e.innerHTML=c(e.dataset.cnt)+"<small>枚</small>");
  const withS=nu.filter(n=>n.sample&&n.season===seasonNow);
  const fh=new URLSearchParams(location.search).get("hero");const h=(fh&&nu.find(n=>n.file===fh))||withS[Math.floor(Math.random()*withS.length)]||nu[0];
  const pics=document.getElementById("pics");
  pics.innerHTML=`<button class="pic" data-open="${esc(h.file)}" aria-label="${esc(h.title)}を拡大"><img class="a" alt="${esc(h.title)}の線画" src="${full(h)}"><img class="b" alt="${esc(h.title)}の色見本" src="${full(h,h.sample)}"></button>`;
  const a=pics.querySelector(".a");const show=()=>{if(a.naturalHeight>a.naturalWidth)pics.classList.add("tate");pics.querySelectorAll("img").forEach(i=>i.classList.add("on"));};
  a.complete&&a.naturalWidth?show():a.addEventListener("load",show);
  const sh=a=>a.slice().sort(()=>Math.random()-.5);
  const se=sh(nu.filter(n=>n.season===seasonNow)).slice(0,4), al=sh(nu.filter(n=>n.season==="通年")).slice(0,4);
  const mix=[];for(let i=0;i<4;i++){if(se[i])mix.push(se[i]);if(al[i])mix.push(al[i]);}
  const rec=n=>`<button class="rec" data-open="${esc(n.file)}"><div class="card c"><img loading="lazy" alt="" src="${thumb(n)}"><span class="lbl ${n.season==="通年"?"always":"season"}">${n.season==="通年"?"通年":"季節"}</span></div><b>${esc(n.title)}</b><span class="m">${esc([n.genre,n.diff].filter(Boolean).join(" ・ "))}</span></button>`;

  (function(){
    const V=new URLSearchParams(location.search).get("ab")||"a";
    const ic=RK.ico;
    const P=nu.filter(n=>n.sample).sort(()=>Math.random()-.5).slice(0,3);
    const ABOUT="介護のレクプリは、高齢者向けの塗り絵・脳トレ・カレンダーを無料で配布しているサイトです。季節の花や動物、懐かしい風景の塗り絵から、難読漢字・計算・言葉遊びの脳トレまで、毎日のレクリエーションに使えるプリントをそろえています。";
    const steps=[["素材を選ぶ","季節・ジャンル・難しさで絞り込めます","search"],["画像を保存する","1枚ずつでも、お気に入りからまとめてでも","down"],["A4で印刷する","使ったものには「使用済み」の印がつきます","cal"]];
    let html="";
    if(V==="a"){
      html=`<section class="ab-a"><div><div class="ey">ABOUT</div><h2>毎日のレクに、<br>ちょうどいい1枚を。</h2><p>${ABOUT}</p></div><div class="ph">${P.map(n=>`<img alt="" src="${RK.thumb(n,n.sample)}">`).join("")}</div></section>
      <ol class="steps-a">${steps.map((s,i)=>`<li><span class="num">0${i+1}</span><b>${s[0]}</b><span class="d">${s[1]}</span></li>`).join("")}</ol>`;
    }else if(V==="b"){
      html=`<section class="ab-b"><div class="ey">ABOUT</div><div class="q">塗る時間が、<em>話す時間</em>になる。</div><p>${ABOUT}</p>
      <ol class="tl">${steps.map((s,i)=>`<li><span class="c">${ic(s[2],28)}</span><b>${i+1}. ${s[0]}</b><span class="d">${s[1]}</span></li>`).join("")}</ol></section>`;
    }else if(V==="c"){
      const f=[["ずっと無料","会員登録もいりません","star"],["A4でそのまま","印刷するだけですぐ使えます","down"],["色見本つき","塗る前に完成イメージが分かります","pal"]];
      const s0=P[0]||nu[0];
      const imgs=[`<img alt="" src="${RK.thumb(s0)}">`,`<div class="mock-btn"><span class="btn p">${ic("down",16)}保存する</span><span class="btn o">${ic("pal",16)}色見本</span></div>`,`<img alt="" src="${RK.thumb(s0,s0.sample)}">`];
      html=`<section class="ab-c"><div class="lead"><div class="ey">ABOUT</div><h2>介護のレクプリについて</h2><p>${ABOUT}</p></div><div class="ft3">${f.map(x=>`<div class="f"><span class="i">${ic(x[2],32)}</span><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>
      <ol class="st-c">${steps.map((s,i)=>`<li><div class="img"><span class="n">${i+1}</span>${imgs[i]}</div><b>${s[0]}</b><span>${s[1]}</span></li>`).join("")}</ol></section>`;
    }else{
      html=`<section class="ab-d"><div class="hd2"><div class="en">ABOUT</div><h2>介護のレクプリ<br>について</h2></div><p>${ABOUT}</p></section>
      <section class="ab-d"><div class="hd2"><div class="en">HOW TO USE</div><h2>使い方</h2></div><ol class="st-d">${steps.map((s,i)=>`<li><span class="n">0${i+1}</span><div><b>${s[0]}</b><span>${s[1]}</span></div></li>`).join("")}</ol></section>`;
    }
    document.getElementById("abhow").innerHTML=html;
  })();
  document.getElementById("recs").innerHTML=mix.slice(0,8).map(rec).join("");
  document.getElementById("news").innerHTML=nu.slice(0,4).map(rec).join("");
})();
</script>
</body>
</html>
