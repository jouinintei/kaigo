<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>アンケート回答｜介護のレクプリ</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#f7f5f2;color:#241f1a}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#8d8478;font-size:13px;margin:0 0 18px}
  .gate{background:#fff;border:1px solid #e7e2dc;border-radius:12px;padding:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .gate input{height:40px;border:1px solid #d8d1c8;border-radius:8px;padding:0 10px;font-size:15px;min-width:240px}
  button{height:40px;border:0;border-radius:8px;background:#b5542b;color:#fff;font-size:15px;padding:0 16px;cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:14px 0}
  .box{background:#fff;border:1px solid #e7e2dc;border-radius:12px;padding:14px}
  .box h2{font-size:15px;margin:0 0 10px}
  .bar{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
  .bar span:first-child{width:150px;flex:none}
  .bar i{display:block;height:12px;background:#e9a37f;border-radius:6px}
  .bar b{font-variant-numeric:tabular-nums;font-weight:600}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e7e2dc;border-radius:12px;overflow:hidden;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top}
  th{background:#f1ece6;font-size:13px}
  .err{color:#c0392b}
</style>
</head>
<body>
<div class="wrap">
  <h1>アンケート回答</h1>
  <p class="sub">予告（作成中）の素材を先行保存するときのアンケートです。キーは保存ログと同じです。</p>
  <div class="gate" id="gate"><input type="password" id="k" placeholder="保存ログのキー"><button id="go">表示する</button><span class="err" id="err"></span></div>
  <div id="app" hidden>
    <div class="cards" id="sum"></div>
    <div class="box" style="margin-bottom:12px"><h2>ほしい題材（自由記述）</h2><div id="wants"></div></div>
    <table><thead><tr><th>日時</th><th>素材</th><th>使う場所</th><th>人数</th><th>ほしい題材</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>
<script>
(function(){
  var KEY_STORE = "rekupuri_savelog_key";
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  function bars(title, items, k){
    var c = {}; items.forEach(function(x){ c[x[k]] = (c[x[k]] || 0) + 1; });
    var e = Object.keys(c).sort(function(a,b){ return c[b] - c[a]; }), mx = Math.max.apply(null, e.map(function(x){ return c[x]; }).concat([1]));
    return '<div class="box"><h2>' + title + '</h2>' + e.map(function(x){
      return '<div class="bar"><span>' + esc(x) + '</span><i style="width:' + Math.round(c[x] / mx * 160) + 'px"></i><b>' + c[x] + '</b></div>';
    }).join("") + '</div>';
  }
  function load(key){
    document.getElementById("err").textContent = "読み込み中…";
    fetch("/api/survey?key=" + encodeURIComponent(key) + "&_=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if (r.status === 404) throw new Error("キーが違うようです"); if (!r.ok) throw new Error("読み込みに失敗しました (" + r.status + ")"); return r.json(); })
      .then(function(j){
        try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
        var it = (j.items || []).slice().reverse();
        document.getElementById("gate").hidden = true;
        document.getElementById("app").hidden = false;
        document.getElementById("sum").innerHTML =
          '<div class="box"><h2>回答数</h2><div style="font-size:32px;font-weight:700">' + it.length + '</div></div>' +
          bars("使う場所", it, "place") + bars("人数", it, "size") + bars("先行保存された素材", it, "title");
        var w = it.filter(function(x){ return x.want; });
        document.getElementById("wants").innerHTML = w.length ? w.map(function(x){ return '<div style="padding:4px 0;border-bottom:1px solid #f0ebe5">' + esc(x.want) + '</div>'; }).join("") : '<span style="color:#8d8478">まだありません</span>';
        document.getElementById("rows").innerHTML = it.map(function(x){
          var d = new Date(new Date(x.t).getTime() + 9 * 3600e3).toISOString().slice(0, 16).replace("T", " ");
          return "<tr><td>" + d + "</td><td>" + esc(x.title || x.f) + "</td><td>" + esc(x.place) + "</td><td>" + esc(x.size) + "</td><td>" + esc(x.want || "") + "</td></tr>";
        }).join("") || '<tr><td colspan="5">まだ回答はありません</td></tr>';
      })
      .catch(function(e){ document.getElementById("gate").hidden = false; document.getElementById("err").textContent = e.message; });
  }
  document.getElementById("go").onclick = function(){ var v = document.getElementById("k").value.trim(); if (v) load(v); };
  var saved = ""; try { saved = localStorage.getItem(KEY_STORE) || ""; } catch (e) {}
  if (saved) load(saved);
})();
</script>
</body>
</html>
